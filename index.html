let stepsItemId = null;

function openStepsSheet(itemId) {
  stepsItemId = itemId;
  renderStepsSheet();
}

function renderStepsSheet() {
  const it = state.items.find(x => x.id === stepsItemId);
  if (!it) { closeModal(); return; }
  if (!it.steps) it.steps = [];
  const prog = stepProgress(it);

  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal" id="modalBody">
        <div class="modal-head">
          <div class="modal-eyebrow">Break It Down</div>
          <button class="icon-btn" id="closeModal">${icons.xBig}</button>
        </div>
        <div class="modal-problem">"${escapeHtml(itemLabel(it))}"</div>
        <div class="principle-note">
          Create only as many steps as necessary to make the next actions obvious. A simple task may need one. Skip micro-steps.
        </div>
        ${prog ? `<div class="step-progress">${prog.done} of ${prog.total} complete</div>` : ''}
        <div id="stepsList">
          ${it.steps.map((s, i) => `
            <div class="step-row">
              <button class="check-circle sm ${s.done ? 'checked' : ''}" data-stepdone="${i}">${s.done ? icons.checkTiny : ''}</button>
              <span class="step-num">${i + 1}</span>
              <input class="step-input ${s.done ? 'done' : ''}" data-steptext="${i}" value="${escapeHtml(s.text)}" placeholder="Meaningful action…" />
              <div class="step-actions">
                <button class="icon-btn" data-addsub="${i}" title="Add subtask">${icons.plus}</button>
                <button class="icon-btn" data-stepup="${i}" ${i === 0 ? 'disabled' : ''}>${icons.chevronUp}</button>
                <button class="icon-btn" data-stepdown="${i}" ${i === it.steps.length - 1 ? 'disabled' : ''}>${icons.chevronDown}</button>
                <button class="icon-btn" data-stepdel="${i}">${icons.x}</button>
              </div>
            </div>
            ${(s.subs || []).map((sb, j) => `
              <div class="sub-row">
                <button class="check-circle sm ${sb.done ? 'checked' : ''}" data-subdone="${i}:${j}">${sb.done ? icons.checkTiny : ''}</button>
                <input class="sub-input ${sb.done ? 'done' : ''}" data-subtext="${i}:${j}" value="${escapeHtml(sb.text)}" placeholder="Subtask…" />
                <button class="icon-btn" data-subdel="${i}:${j}">${icons.x}</button>
              </div>
            `).join('')}
          `).join('')}
        </div>
        <button class="btn-secondary-full" id="addStepBtn" style="margin-top:10px;">${icons.plus}<span>Add Step</span></button>
        <button class="btn-primary-full" id="saveStepsBtn" style="margin-top:14px;">${icons.check}<span>Done</span></button>
      </div>
    </div>
  `;

  document.getElementById('modalOverlay').addEventListener('click', closeModal);
  document.getElementById('modalBody').addEventListener('click', e => e.stopPropagation());
  document.getElementById('closeModal').addEventListener('click', closeModal);

  const commitInputs = () => {
    document.querySelectorAll('[data-steptext]').forEach(inp => {
      const i = Number(inp.dataset.steptext);
      if (it.steps[i]) it.steps[i].text = inp.value;
    });
    document.querySelectorAll('[data-subtext]').forEach(inp => {
      const [i, j] = inp.dataset.subtext.split(':').map(Number);
      if (it.steps[i] && it.steps[i].subs && it.steps[i].subs[j]) it.steps[i].subs[j].text = inp.value;
    });
  };

  document.getElementById('addStepBtn').addEventListener('click', () => {
    commitInputs();
    it.steps.push({ id: uid('s'), text: '', done: false, subs: [] });
    saveState(); renderStepsSheet();
  });
  document.getElementById('saveStepsBtn').addEventListener('click', () => {
    commitInputs();
    it.steps = it.steps.filter(s => s.text.trim() || (s.subs || []).some(sb => sb.text.trim()));
    it.steps.forEach(s => { s.subs = (s.subs || []).filter(sb => sb.text.trim()); });
    saveState(); closeModal(); render();
  });

  document.querySelectorAll('[data-stepdone]').forEach(b => b.addEventListener('click', () => {
    commitInputs();
    const i = Number(b.dataset.stepdone);
    it.steps[i].done = !it.steps[i].done;
    saveState(); renderStepsSheet();
  }));
  document.querySelectorAll('[data-stepdel]').forEach(b => b.addEventListener('click', () => {
    commitInputs();
    it.steps.splice(Number(b.dataset.stepdel), 1);
    saveState(); renderStepsSheet();
  }));
  document.querySelectorAll('[data-stepup]').forEach(b => b.addEventListener('click', () => {
    if (b.disabled) return;
    commitInputs();
    const i = Number(b.dataset.stepup);
    [it.steps[i - 1], it.steps[i]] = [it.steps[i], it.steps[i - 1]];
    saveState(); renderStepsSheet();
  }));
  document.querySelectorAll('[data-stepdown]').forEach(b => b.addEventListener('click', () => {
    if (b.disabled) return;
    commitInputs();
    const i = Number(b.dataset.stepdown);
    [it.steps[i + 1], it.steps[i]] = [it.steps[i], it.steps[i + 1]];
    saveState(); renderStepsSheet();
  }));
  document.querySelectorAll('[data-addsub]').forEach(b => b.addEventListener('click', () => {
    commitInputs();
    const i = Number(b.dataset.addsub);
    if (!it.steps[i].subs) it.steps[i].subs = [];
    it.steps[i].subs.push({ id: uid('sb'), text: '', done: false });
    saveState(); renderStepsSheet();
  }));
  document.querySelectorAll('[data-subdone]').forEach(b => b.addEventListener('click', () => {
    commitInputs();
    const [i, j] = b.dataset.subdone.split(':').map(Number);
    it.steps[i].subs[j].done = !it.steps[i].subs[j].done;
    saveState(); renderStepsSheet();
  }));
  document.querySelectorAll('[data-subdel]').forEach(b => b.addEventListener('click', () => {
    commitInputs();
    const [i, j] = b.dataset.subdel.split(':').map(Number);
    it.steps[i].subs.splice(j, 1);
    saveState(); renderStepsSheet();
  }));
}

  }));

  document.getElementById('dwTimerBtn').addEventListener('click', toggleDwTimer);
  if (dwTimerStart && !dwTimerInterval) startDwInterval();

  document.getElementById('abandonDeep').addEventListener('click', () => {
    confirmDialog({
      title: 'Abandon session?', message: 'Draft discarded. The signal stays in the queue.', okText: 'Abandon',
      onConfirm: () => { stopDwTimer(); deepDraft = null; render(); },
    });
  });

  document.getElementById('closeDeep').addEventListener('click', () => {
    if (!deepDraft.nextTest.trim()) return;
    const it = state.items.find(x => x.id === deepDraft.itemId);
    state.deepWork.unshift({
      id: uid('dw'), itemId: deepDraft.itemId, sourceText: deepDraft.sourceText,
      problem: deepDraft.problem.trim(), impact: deepDraft.impact.trim(),
      cause: deepDraft.cause.trim(), system: deepDraft.system.trim(),
      nextTest: deepDraft.nextTest.trim(), ts: Date.now(),
      domainId: it ? it.domainId : null,
    });
    state.deepWork = state.deepWork.slice(0, 60);
    if (it) it.nextAction = deepDraft.nextTest.trim();
    saveState(); stopDwTimer(); deepDraft = null;
    showToast('Loop closed'); render();
  });
}

function fmtTimer(ms) {
  const t = Math.floor(ms / 1000);
  return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
}
function toggleDwTimer() {
  if (dwTimerStart) { stopDwTimer(); showToast('Timer stopped'); }
  else { dwTimerStart = Date.now(); dwReframeShown = false; startDwInterval(); showToast('Timer started'); }
  const b = document.getElementById('dwTimerBtn');
  if (b) b.textContent = dwTimerStart ? 'Stop' : 'Start';
}
function startDwInterval() {
  if (dwTimerInterval) clearInterval(dwTimerInterval);
  dwTimerInterval = setInterval(() => {
    if (!dwTimerStart) { stopDwTimer(); return; }
    const el = document.getElementById('dwTimerDisplay');
    const elapsed = Date.now() - dwTimerStart;
    if (el) el.textContent = fmtTimer(elapsed);
    if (!dwReframeShown && elapsed > 18 * 60 * 1000) { dwReframeShown = true; showReframe(); }
  }, 1000);
}
function stopDwTimer() {
  dwTimerStart = null; dwReframeShown = false;
  if (dwTimerInterval) { clearInterval(dwTimerInterval); dwTimerInterval = null; }
  const el = document.getElementById('dwTimerDisplay');
  if (el) el.textContent = '—';
}
function showReframe() {
  const slot = document.getElementById('dwReframeBanner');
  if (!slot) return;
  slot.innerHTML = `
    <div class="dw-reframe">
      <div class="dw-reframe-head">
        <strong>18 minutes in. Stuck?</strong>
        <button class="icon-btn" id="dwReframeDismiss">${icons.x}</button>
      </div>
      <div class="dw-reframe-body">
        <ul>
          <li><strong>Collapse to one layer.</strong> Smallest version finishable in 10 min?</li>
          <li><strong>Convert to a question.</strong> What would 30 min of observation answer?</li>
          <li><strong>Close early.</strong> Write Next Test as "collect X data," save, walk away.</li>
        </ul>
      </div>
    </div>
  `;
  document.getElementById('dwReframeDismiss').addEventListener('click', () => { slot.innerHTML = ''; });
}

    saveState(); render();
  }));
  document.querySelectorAll('[data-wsys]').forEach(b => b.addEventListener('click', () => {

  }));

function systemizeItem(itemId) {
  const it = state.items.find(x => x.id === itemId);
  if (!it) return;
  confirmDialog({
    title: 'Systemize this?',

    okText: 'Systemize', danger: false,
    onConfirm: () => {
      const copy = {
        id: uid('i'),
        text: 'Why does this repeatedly require me? — ' + itemLabel(it),
        ts: Date.now(), status: 'scheduled',
        needsMe: true, nowMeta: null, todayMeta: null, delegateMeta: null,
        scheduleMeta: { returnAt: todayKey() },
        classification: 'signal', itemType: 'problem',
        signal: { impact: 3, frequency: 4, evidence: 4, strategic: 3, leverage: 5, score: 19, worthIt: 'yes' },
        steps: [], domainId: it.domainId || null, doneAt: null, nextAction: '',
      };
      state.items.unshift(copy);

function schedCardHTML(it, tk) {

function renderClose(root) {

  }
  const done = doneToday();
  const openItems = [...todayPrimary(), ...todaySupporting(), ...nowItems()];

  root.innerHTML = `
    <div class="section-head">
      <div class="eyebrow">Close</div>
      <h1>End the day.</h1>
      <p class="sub">The system remembers. You only decide what happens next.</p>

    <div class="close-auto-section">

      ${done.length === 0
        ? '<div class="close-auto-empty">Nothing marked complete today.</div>'
        : done.map(it => `<div class="close-auto-item">· ${escapeHtml(itemLabel(it))}</div>`).join('')}
    </div>

    <div class="sd-field">
      <div class="sd-head">
        <span class="sd-num">01</span>
        <div>
          <div class="sd-label">Moved forward</div>
          <div class="sd-sub">What meaningfully advanced today? Completion isn't the same as progress.</div>
        </div>
      </div>
      <textarea class="sd-textarea" id="movedForward" rows="3" placeholder="…">${escapeHtml(state.shutdown.movedForward || '')}</textarea>
    </div>

    <div class="today-section-label">Still open${openItems.length ? ` <span class="count-pill">${openItems.length}</span>` : ''}</div>
    ${openItems.length === 0
      ? '<div class="empty" style="padding:16px;">Everything closed out.</div>'
      : openItems.map(it => `
        <div class="open-item">
          <div class="open-item-text">${escapeHtml(itemLabel(it))}</div>
          <label class="open-item-label">Next action</label>
          <input class="open-item-input" data-next="${it.id}" value="${escapeHtml(it.nextAction || '')}" placeholder="What happens next with this…" />
        </div>
      `).join('')}

    <button class="btn-primary-full" id="closeDayBtn" style="margin-top:24px;">${icons.moon}<span>Close the Day</span></button>

    ${state.history.length ? `
      <div class="divider"><span class="divider-text">Recent closes</span></div>
      <div class="list">
        ${state.history.slice(0, 3).map(h => `
          <div class="history-card">
            <div class="history-date">${formatDate(new Date(h.ts))}</div>
            ${h.movedForward ? `<div class="history-row"><span class="history-label">Moved</span>${nl2br(h.movedForward)}</div>` : ''}
            <div class="history-row"><span class="history-label">Done</span>${h.doneCount || 0} items</div>
          </div>
        `).join('')}
      </div>
    ` : ''}
  `;

  document.getElementById('movedForward').addEventListener('input', e => {
    state.shutdown.movedForward = e.target.value;
    saveState();
  });
  document.querySelectorAll('[data-next]').forEach(inp => inp.addEventListener('input', e => {
    const it = state.items.find(x => x.id === inp.dataset.next);
    if (it) { it.nextAction = e.target.value; saveState(); }
  }));

  document.getElementById('closeDayBtn').addEventListener('click', () => {
    confirmDialog({
      title: 'Close the day?',
      message: 'Archives today. Unfinished items carry to tomorrow with their next actions intact.',
      okText: 'Close Day', cancelText: 'Not yet', danger: false,
      onConfirm: () => {
        state.history.unshift({
          date: todayKey(), ts: Date.now(),
          movedForward: state.shutdown.movedForward || '',
          doneCount: done.length,
          doneItems: done.map(i => itemLabel(i)),
          openItems: openItems.map(i => ({ text: itemLabel(i), nextAction: i.nextAction || '' })),
        });
        state.history = state.history.slice(0, 120);
        // Carry unfinished today items to tomorrow
        openItems.forEach(it => {
          if (it.status === 'today' && it.todayMeta) it.todayMeta.date = todayKey();
        });
        state.shutdown = { date: todayKey(), movedForward: '' };
        saveState();
        showToast('Day closed');
        render();
      },
    });
  });
}

function moveDomain(id, dir) {
  const i = state.domains.findIndex(d => d.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= state.domains.length) return;
  [state.domains[i], state.domains[j]] = [state.domains[j], state.domains[i]];
  saveState(); render();
}

// ============ HISTORY ============
function renderHistory(root) {
  const buckets = {};
  const put = (k, fn) => {
    if (!buckets[k]) buckets[k] = { date: k, ts: new Date(k + 'T12:00:00').getTime(), close: null, captured: [], done: [], deep: [] };
    fn(buckets[k]);
  };
  state.history.forEach(h => put(h.date || new Date(h.ts).toISOString().slice(0,10), b => { b.close = h; b.ts = h.ts; }));
  state.items.forEach(i => {
    put(new Date(i.ts).toISOString().slice(0,10), b => b.captured.push(i));
    if (i.doneAt) put(new Date(i.doneAt).toISOString().slice(0,10), b => b.done.push(i));
  });
  state.deepWork.forEach(d => put(new Date(d.ts).toISOString().slice(0,10), b => b.deep.push(d)));

  const days = Object.values(buckets).sort((a,b) => b.date.localeCompare(a.date));

  root.innerHTML = `
    <div class="section-head">
      <div class="eyebrow">History</div>
      <h1>Past days.</h1>
      <p class="sub">Scroll back. Nothing to download.</p>
    </div>
    ${days.length === 0 ? '<div class="empty">No history yet.</div>' : `
      <div class="list">
        ${days.slice(0, 60).map((d, i) => `
          <div class="history-card" style="padding:0;">
            <button data-day="${i}" style="width:100%;text-align:left;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;">
              <div>
                <div style="font-size:14px;font-weight:500;font-style:italic;">${formatDate(new Date(d.ts))}${d.date === todayKey() ? ' · today' : ''}</div>
                <div style="font-size:11px;color:var(--ink-muted);font-family:var(--mono);margin-top:4px;">
                  ${d.captured.length} captured · ${d.done.length} done · ${d.deep.length} deep${d.close ? ' · closed' : ''}
                </div>
              </div>
              <span id="chev-${i}">${i === 0 ? icons.chevronUp : icons.chevronDown}</span>
            </button>
            <div id="body-${i}" style="display:${i===0?'block':'none'};padding:0 16px 16px;">
              ${d.close && d.close.movedForward ? `<div class="history-row"><span class="history-label">Moved</span>${nl2br(d.close.movedForward)}</div>` : ''}
              ${d.done.length ? `<div style="margin-top:12px;"><div class="history-label" style="display:block;margin-bottom:6px;">Completed</div>
                ${d.done.map(x => `<div style="font-size:12px;line-height:1.5;color:var(--ink-soft);">· ${escapeHtml(itemLabel(x))}</div>`).join('')}</div>` : ''}
              ${d.deep.length ? `<div style="margin-top:12px;"><div class="history-label" style="display:block;margin-bottom:6px;">Deep sessions</div>
                ${d.deep.map(x => `<div style="font-size:12px;line-height:1.5;color:var(--ink-soft);margin-bottom:6px;padding-left:8px;border-left:2px solid var(--line);">
                  <div style="color:var(--ink);font-style:italic;">${escapeHtml(x.problem || x.sourceText || '')}</div>
                  ${x.system ? `<div>System: ${escapeHtml(x.system)}</div>` : ''}
                  <div>Next: ${escapeHtml(x.nextTest || '')}</div>
                </div>`).join('')}</div>` : ''}
              ${d.captured.length ? `<div style="margin-top:12px;"><div class="history-label" style="display:block;margin-bottom:6px;">Captured</div>
                ${d.captured.slice(0,15).map(x => `<div style="font-size:12px;line-height:1.5;color:var(--ink-soft);">· ${escapeHtml(x.text)}</div>`).join('')}</div>` : ''}
            </div>
          </div>
        `).join('')}
      </div>
    `}
  `;
  document.querySelectorAll('[data-day]').forEach(b => b.addEventListener('click', () => {

function renderCloudSyncSection() {

  const configured = !!(cs.projectId && cs.apiKey && cs.userId);
  return `
    <div class="sync-status ${cs.enabled && configured ? 'active' : ''}">

      <summary style="font-size:13px;cursor:pointer;font-weight:500;font-style:italic;">${configured ? 'Edit sync settings' : 'Set up cloud sync (Firebase)'}</summary>

        <label class="label">Web API Key</label>
        <input class="field-input" id="cs-apikey" value="${escapeHtml(cs.apiKey||'')}" placeholder="AIza..." />
        <label class="label">User ID<span class="label-sub">Same on every device. Pick something obscure.</span></label>
        <input class="field-input" id="cs-userid" value="${escapeHtml(cs.userId||'')}" placeholder="dudehunt-7392" />
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">

          <button class="btn-secondary-full" id="cs-toggle" style="flex:1;">${cs.enabled ? 'Disable' : 'Enable'}</button>
        </div>
        ${configured && cs.enabled ? `<div style="display:flex;gap:8px;margin-top:8px;">
          <button class="btn-secondary-full" id="cs-push" style="flex:1;">${icons.upload}<span>Push</span></button>
          <button class="btn-secondary-full" id="cs-pull" style="flex:1;">${icons.download}<span>Pull</span></button>
        </div>` : ''}
      </div>
    </details>
  `;
}
function bindCloudSyncHandlers() {
  const p = document.getElementById('cs-projectid');
  if (!p) return;
  const k = document.getElementById('cs-apikey');
  const u = document.getElementById('cs-userid');
  const save = () => {
    state.cloudSync = state.cloudSync || {};
    state.cloudSync.projectId = p.value.trim();
    state.cloudSync.apiKey = k.value.trim();
    state.cloudSync.userId = u.value.trim();
    saveState();
  };
  document.getElementById('cs-test').addEventListener('click', async () => {
    save();
    const cs = state.cloudSync;
    if (!cs.projectId || !cs.apiKey || !cs.userId) { showToast('Fill all three'); return; }
    showToast('Testing…');
    try {
      const r = await fetch(`https://firestore.googleapis.com/v1/projects/${encodeURIComponent(cs.projectId)}/databases/(default)/documents/ledger_state?pageSize=1&key=${encodeURIComponent(cs.apiKey)}`);
      showToast(r.ok ? 'Connection works' : 'Failed: ' + r.status);
    } catch (e) { showToast('Network error'); }
  });
  document.getElementById('cs-toggle').addEventListener('click', () => {
    save();
    state.cloudSync.enabled = !state.cloudSync.enabled;
    saveState(); render();
    showToast(state.cloudSync.enabled ? 'Sync enabled' : 'Sync disabled');
  });
  const pb = document.getElementById('cs-push');
  if (pb) pb.addEventListener('click', async () => { if (await cloudPush()) showToast('Pushed'); });
  const pl = document.getElementById('cs-pull');
  if (pl) pl.addEventListener('click', () => confirmDialog({
    title: 'Pull from cloud?', message: 'Replaces local data with the cloud copy.', okText: 'Pull',
    onConfirm: () => cloudPull(),
  }));
}
async function cloudPush(silent) {
  const cs = state.cloudSync;
  if (!cs || !cs.enabled || !cs.projectId || !cs.apiKey || !cs.userId) return false;
  try {
    const url = `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(cs.projectId)}/databases/(default)/documents/ledger_state/${encodeURIComponent(cs.userId)}?key=${encodeURIComponent(cs.apiKey)}`;
    const r = await fetch(url, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: { data: { stringValue: JSON.stringify(state) }, updatedAt: { timestampValue: new Date().toISOString() } } }),
    });
    if (r.ok) {
      state.cloudSync.lastSync = Date.now();
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      return true;
    }
    if (!silent) showToast('Push failed: ' + r.status);
    return false;
  } catch (e) { if (!silent) showToast('Network error'); return false; }
}
async function cloudPull() {
  const cs = state.cloudSync;
  if (!cs || !cs.projectId || !cs.apiKey || !cs.userId) return false;
  try {
    const url = `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(cs.projectId)}/databases/(default)/documents/ledger_state/${encodeURIComponent(cs.userId)}?key=${encodeURIComponent(cs.apiKey)}`;
    const r = await fetch(url);
    if (r.status === 404) { showToast('No cloud data — push first'); return false; }
    if (!r.ok) { showToast('Pull failed: ' + r.status); return false; }
    const doc = await r.json();
    const sv = doc && doc.fields && doc.fields.data && doc.fields.data.stringValue;
    if (!sv) { showToast('Cloud empty'); return false; }
    const cloud = JSON.parse(sv);
    const keep = state.cloudSync;
    state = normalizeState(cloud);
    state.cloudSync = keep;
    state.cloudSync.lastSync = Date.now();
    saveState(); showToast('Pulled'); render();
    return true;
  } catch (e) { showToast('Network error'); return false; }
}
let cloudPushTimer = null;
function scheduleCloudPush() {
  const cs = state.cloudSync;
  if (!cs || !cs.enabled) return;
  if (cloudPushTimer) clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(() => cloudPush(true), 30000);
}

// ============ EXPORT / IMPORT ============
function exportData() {
  const blob = new Blob([JSON.stringify({ version: 3, exportedAt: new Date().toISOString(), data: state }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'ledger-backup-' + todayKey() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup downloaded');
}
function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  confirmDialog({
    title: 'Replace all data?', message: 'Overwrites everything currently saved.', okText: 'Replace',
    onConfirm: () => {
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const parsed = JSON.parse(ev.target.result);
          state = normalizeState(parsed.data || parsed);
          saveState(); showToast('Restored'); render();
        } catch (err) { showToast('Could not read file'); }
        e.target.value = '';
      };
      reader.readAsText(file);
    },
  });
}

function showToast(msg) {
  const r = document.getElementById('toast-root');
  r.innerHTML = `<div class="toast">${escapeHtml(msg)}</div>`;
  setTimeout(() => { if (r.firstChild) r.innerHTML = ''; }, 2200);
}
function confirmDialog({ title, message, okText = 'Delete', cancelText = 'Cancel', danger = true, onConfirm }) {
  const r = document.getElementById('confirm-root');
  r.innerHTML = `
    <div class="confirm-overlay" id="confirmOverlay">
      <div class="confirm-box" id="confirmBox">
        <div class="confirm-title">${escapeHtml(title)}</div>
        <div class="confirm-message">${escapeHtml(message)}</div>
        <div class="confirm-actions">
          <button class="confirm-cancel" id="confirmCancel">${escapeHtml(cancelText)}</button>
          <button class="confirm-ok ${danger?'danger':''}" id="confirmOk">${escapeHtml(okText)}</button>
        </div>
      </div>
    </div>
  `;
  const close = () => { r.innerHTML = ''; };
  document.getElementById('confirmOverlay').addEventListener('click', close);
  document.getElementById('confirmBox').addEventListener('click', e => e.stopPropagation());
  document.getElementById('confirmCancel').addEventListener('click', close);
  document.getElementById('confirmOk').addEventListener('click', () => { close(); onConfirm(); });
}
function closeModal() {
  document.getElementById('modal-root').innerHTML = '';
  proc = null; stepsItemId = null;
}

// ============ INSTALL PROMPT ============
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredInstallPrompt = e;
  if (!localStorage.getItem('ledger_install_dismissed')) showInstallBanner();
});
function showInstallBanner() {
  document.getElementById('install-root').innerHTML = `
    <div class="install-banner">
      <div class="install-banner-text">Install Ledger for faster access and offline use.</div>
      <button class="install-banner-btn" id="installAccept">Install</button>
      <button class="install-banner-close" id="installDismiss">${icons.xBig}</button>
    </div>
  `;
  document.getElementById('installAccept').addEventListener('click', async () => {
    if (deferredInstallPrompt) { deferredInstallPrompt.prompt(); await deferredInstallPrompt.userChoice; deferredInstallPrompt = null; }
    document.getElementById('install-root').innerHTML = '';
  });
  document.getElementById('installDismiss').addEventListener('click', () => {
    localStorage.setItem('ledger_install_dismissed', '1');
    document.getElementById('install-root').innerHTML = '';
  });
}

// ============ SERVICE WORKER ============
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'ledger-v4';
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => e.waitUntil(
      caches.keys().then(ks => Promise.all(ks.filter(k => k !== CACHE).map(k => caches.delete(k)))).then(() => self.clients.claim())
    ));
    self.addEventListener('fetch', e => {
      if (e.request.method !== 'GET') return;
      const u = new URL(e.request.url);
      const isHtml = e.request.mode === 'navigate' || e.request.destination === 'document' || u.pathname.endsWith('.html') || u.pathname.endsWith('/');
      if (isHtml) {
        e.respondWith(fetch(e.request).then(r => {
          if (r && r.status === 200) { const c = r.clone(); caches.open(CACHE).then(x => x.put(e.request, c)); }
          return r;
        }).catch(() => caches.match(e.request)));
      } else {
        e.respondWith(caches.open(CACHE).then(c => c.match(e.request).then(cached => {
          const f = fetch(e.request).then(r => { if (r && r.status === 200) c.put(e.request, r.clone()); return r; }).catch(() => cached);
          return cached || f;
        })));
      }
    });
  `;
  try {
    navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode], { type: 'application/javascript' }))).catch(() => {});
  } catch (e) {}
}

// ============ NORMALIZE + MIGRATE ============
function normalizeState(s) {
  if (!s || typeof s !== 'object') s = {};
  const out = JSON.parse(JSON.stringify(defaultState));

  // --- v3 shape: unified items ---
  if (Array.isArray(s.items)) {
    out.items = s.items.filter(i => i && typeof i === 'object' && typeof i.text === 'string').map(i => ({
      id: i.id || uid('i'),
      text: i.text,
      ts: Number(i.ts) || Date.now(),
      status: ['inbox','now','today','delegated','scheduled','done','archived'].includes(i.status) ? i.status : 'inbox',
      needsMe: typeof i.needsMe === 'boolean' ? i.needsMe : null,
      nowMeta: i.nowMeta && typeof i.nowMeta === 'object' ? i.nowMeta : null,
      todayMeta: i.todayMeta && typeof i.todayMeta === 'object' ? i.todayMeta : null,
      delegateMeta: i.delegateMeta && typeof i.delegateMeta === 'object' ? i.delegateMeta : null,
      scheduleMeta: i.scheduleMeta && typeof i.scheduleMeta === 'object' ? i.scheduleMeta : null,
      classification: i.classification === 'signal' || i.classification === 'noise' ? i.classification : null,
      signal: i.signal && typeof i.signal === 'object' ? i.signal : null,
      itemType: ['thought','task','problem'].includes(i.itemType) ? i.itemType : null,
      steps: Array.isArray(i.steps) ? i.steps.filter(x => x && typeof x === 'object').map(st => ({
        id: st.id || uid('s'), text: String(st.text||''), done: !!st.done,
        subs: Array.isArray(st.subs) ? st.subs.filter(x => x && typeof x === 'object').map(sb => ({ id: sb.id||uid('sb'), text: String(sb.text||''), done: !!sb.done })) : [],
      })) : [],
      domainId: i.domainId || null,
      doneAt: Number(i.doneAt) || null,
      nextAction: String(i.nextAction || ''),
    }));
  }

  // --- MIGRATE v2 shape (captures / queue / today.items) ---
  else {
    const migrated = [];
    if (Array.isArray(s.captures)) {
      s.captures.filter(c => c && typeof c === 'object' && typeof c.text === 'string').forEach(c => {
        migrated.push({
          id: uid('i'), text: c.text, ts: Number(c.ts) || Date.now(),
          status: c.kind === 'noise' ? 'scheduled' : 'inbox',
          needsMe: null, nowMeta: null, todayMeta: null, delegateMeta: null,
          scheduleMeta: c.kind === 'noise' ? { returnAt: todayKey() } : null,
          classification: c.kind === 'noise' ? 'noise' : null,
          signal: null, itemType: null, steps: [], domainId: null, doneAt: null, nextAction: '',
        });
      });
    }
    if (Array.isArray(s.queue)) {
      s.queue.filter(q => q && typeof q === 'object' && typeof q.problem === 'string').forEach(q => {
        const f = Number(q.frequency) || 3, im = Number(q.impact) || 3;
        migrated.push({
          id: uid('i'), text: q.problem, ts: Number(q.ts) || Date.now(),
          status: 'scheduled', needsMe: true, nowMeta: null, todayMeta: null, delegateMeta: null,
          scheduleMeta: { returnAt: todayKey() },
          classification: 'signal',
          signal: { impact: im, frequency: f, evidence: q.dataSolvable ? 4 : 3, strategic: 3, leverage: q.recurring ? 4 : 2,
                    score: im + f + (q.dataSolvable?4:3) + 3 + (q.recurring?4:2), worthIt: 'later' },
          itemType: 'problem',
          steps: Array.isArray(q.layers) ? q.layers.filter(l => typeof l === 'string' && l.trim()).map(l => ({ id: uid('s'), text: l, done: false, subs: [] })) : [],
          domainId: q.domainId || null, doneAt: null, nextAction: '',
        });
      });
    }
    if (s.today && Array.isArray(s.today.items)) {
      s.today.items.forEach(x => {
        const text = typeof x === 'string' ? x : (x && x.text) || '';
        if (!text.trim()) return;
        const isDone = typeof x === 'object' && x.done;
        migrated.push({
          id: uid('i'), text: text.trim(), ts: Date.now(),
          status: isDone ? 'done' : 'today',
          needsMe: true, nowMeta: null,
          todayMeta: { tier: 'primary', date: todayKey(), whyToday: '', whatIfNot: '' },
          delegateMeta: null, scheduleMeta: null, classification: null, signal: null,
          itemType: 'task', steps: [], domainId: null,
          doneAt: isDone ? Date.now() : null, nextAction: '',
        });
      });
    }
    out.items = migrated;
  }

  if (Array.isArray(s.domains)) {
    out.domains = s.domains.filter(d => d && typeof d === 'object' && typeof d.name === 'string').map(d => ({
      id: d.id || uid('d'), name: d.name, youDep: Number(d.youDep)||3,
      status: d.status || 'manual', intervention: String(d.intervention||''),
      sop: String(d.sop||''), cadence: d.cadence || 'none',
      ts: Number(d.ts)||Date.now(), reviewedAt: Number(d.reviewedAt)||Date.now(),
    }));
  }

  if (Array.isArray(s.deepWork)) {
    out.deepWork = s.deepWork.filter(d => d && typeof d === 'object').map(d => ({
      id: d.id || uid('dw'), itemId: d.itemId || d.queueId || null,
      sourceText: String(d.sourceText || d.problemText || ''),
      problem: String(d.problem||''),
      impact: String(d.impact || d.objective || ''),
      cause: String(d.cause || d.variables || ''),
      system: String(d.system || d.output || ''),
      nextTest: String(d.nextTest || d.nextAction || ''),
      ts: Number(d.ts)||Date.now(), domainId: d.domainId || null,
    }));
  }

  if (Array.isArray(s.rewards)) {
    out.rewards = s.rewards.filter(r => r && typeof r === 'object' && typeof r.name === 'string').map(r => ({
      id: r.id || uid('r'), name: r.name, description: String(r.description||''),
      goal: String(r.goal||''), progress: Number(r.progress)||0,
      target: Math.max(1, Number(r.target)||1), unit: String(r.unit||''),
      claimed: !!r.claimed, claimedAt: Number(r.claimedAt)||0, ts: Number(r.ts)||Date.now(),
    }));
  }
  if (Array.isArray(s.milestones)) {
    out.milestones = s.milestones.filter(m => m && typeof m === 'object' && typeof m.text === 'string')
      .map(m => ({ id: m.id||uid('m'), text: m.text, ts: Number(m.ts)||Date.now() }));
  }
  if (Array.isArray(s.history)) {
    out.history = s.history.filter(h => h && typeof h === 'object').map(h => ({
      date: String(h.date||''), ts: Number(h.ts)||Date.now(),
      movedForward: String(h.movedForward || h.moved || ''),
      doneCount: Number(h.doneCount)||0,
      doneItems: Array.isArray(h.doneItems) ? h.doneItems : [],
      openItems: Array.isArray(h.openItems) ? h.openItems : [],
    }));
  }
  if (s.shutdown && typeof s.shutdown === 'object') {
    out.shutdown = { date: String(s.shutdown.date||''), movedForward: String(s.shutdown.movedForward || s.shutdown.moved || '') };
  }
  if (typeof s.brainDump === 'string') out.brainDump = s.brainDump;
  if (Array.isArray(s.people)) out.people = s.people.filter(p => typeof p === 'string');
  if (s.cloudSync && typeof s.cloudSync === 'object') {
    out.cloudSync = {
      enabled: !!s.cloudSync.enabled,
      projectId: String(s.cloudSync.projectId||''),
      apiKey: String(s.cloudSync.apiKey||''),
      userId: String(s.cloudSync.userId||''),
      lastSync: Number(s.cloudSync.lastSync)||0,
    };
  }
  return out;
}

// ============ BOOT ============
try {
  state = normalizeState(state);
  if (!state.shutdown || state.shutdown.date !== todayKey()) {
    state.shutdown = { date: todayKey(), movedForward: '' };
  }
  saveState();
} catch (e) {
  console.error('Normalize failed:', e);
  state = JSON.parse(JSON.stringify(defaultState));
  try { saveState(); } catch (e2) {}
}

try {
  document.getElementById('menuBtn').addEventListener('click', e => {
    e.stopPropagation(); toggleHeaderMenu();
  });
} catch (e) { console.error(e); }

function safeRender() {
  try { render(); }
  catch (err) {
    console.error('Render failed:', err);
    const m = document.getElementById('main');
    const tb = document.getElementById('tabbar');
    if (tb) tb.innerHTML = '';
    if (m) m.innerHTML = `
      <div style="padding:20px;font-family:Georgia,serif;color:#1a1612;">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.18em;color:#9a3412;font-weight:600;margin-bottom:10px;font-family:ui-monospace,monospace;">Error</div>
        <h1 style="font-size:24px;font-style:italic;font-weight:500;margin-bottom:14px;">Something broke.</h1>
        <p style="font-size:14px;color:#5d544a;line-height:1.55;margin-bottom:18px;">Your data is still saved on this device.</p>
        <p style="font-size:12px;background:#efe6d6;padding:10px;border-radius:3px;font-family:ui-monospace,monospace;margin-bottom:18px;word-break:break-word;">${escapeHtml(err.message || String(err))}</p>
        <a href="./rescue.html" style="display:block;text-align:center;background:#1a1612;color:#f6f1e8;padding:14px;border-radius:2px;text-decoration:none;font-family:ui-monospace,monospace;font-size:13px;text-transform:uppercase;letter-spacing:0.06em;">Open Rescue Page</a>
      </div>`;
  }
}
safeRender();
</script>
