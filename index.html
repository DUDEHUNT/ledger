<style>
  :root {
    --bg: #f6f1e8;
    --bg-card: #fbf7ef;
    --ink: #1a1612;
    --ink-soft: #5d544a;
    --ink-muted: #8a7f72;
    --line: #e6dccc;
    --line-soft: #efe6d6;
    --accent: #9a3412;
    --noise: #a89378;
    --signal: #4a6741;
    --serif: 'Fraunces', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); font-family: var(--serif); overscroll-behavior-y: contain; }
  body {
    min-height: 100vh; min-height: 100dvh;
    padding-bottom: calc(90px + env(safe-area-inset-bottom));
    padding-top: env(safe-area-inset-top);
  }
  input, textarea, button, select { font-family: inherit; color: inherit; }
  textarea { resize: none; }
  input:focus, textarea:focus { outline: none; }
  button { background: none; border: none; cursor: pointer; }
  button:not(:disabled):active { transform: scale(0.98); }
  ::placeholder { color: #b8ac9c; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg); border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top);
  }
  .header-inner {
    padding: 14px 20px 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand-mark { font-size: 22px; color: var(--accent); font-style: italic; }
  .brand-text { font-size: 15px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .date-text { font-size: 11px; color: var(--ink-muted); font-family: var(--mono); letter-spacing: 0.04em; }
  .header-btn { color: var(--ink-soft); padding: 4px; display: flex; align-items: center; }

  main { padding: 24px 20px; animation: fadeIn 0.25s ease; }

  .section-head { margin-bottom: 28px; }
  .eyebrow {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em;
    color: var(--accent); font-weight: 600; margin-bottom: 10px;
    font-family: var(--mono);
  }
  h1 {
    font-size: 32px; font-weight: 500; line-height: 1.05;
    margin-bottom: 12px; letter-spacing: -0.02em; font-style: italic;
  }
  .sub { font-size: 14px; line-height: 1.55; color: var(--ink-soft); max-width: 34ch; }

  /* Capture */
  .capture-box {
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 4px; padding: 16px;
  }
  .capture-textarea {
    width: 100%; border: none; background: transparent;
    font-size: 16px; line-height: 1.5; margin-bottom: 12px;
  }
  .capture-actions { display: flex; gap: 8px; }
  .btn-signal {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--ink); color: var(--bg);
    padding: 11px 16px; border-radius: 2px;
    font-size: 12px; font-weight: 500; letter-spacing: 0.06em;
    text-transform: uppercase; font-family: var(--mono);
  }
  .btn-noise {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: transparent; color: var(--ink-soft);
    border: 1px solid var(--line);
    padding: 11px 16px; border-radius: 2px;
    font-size: 12px; font-weight: 500; letter-spacing: 0.06em;
    text-transform: uppercase; font-family: var(--mono);
  }
  .btn-signal:disabled, .btn-noise:disabled { opacity: 0.4; }
  .capture-hint {
    margin-top: 14px; padding: 12px 14px;
    background: var(--line-soft); border-radius: 4px;
    font-size: 12px; line-height: 1.5; color: var(--ink-soft);
  }
  .capture-hint strong { color: var(--ink); font-weight: 600; font-style: italic; }

  .btn-primary-full {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--ink); color: var(--bg); width: 100%;
    padding: 14px; border-radius: 2px;
    font-size: 13px; font-weight: 500; letter-spacing: 0.06em;
    text-transform: uppercase; font-family: var(--mono);
  }
  .btn-primary-full:disabled { opacity: 0.4; }
  .btn-secondary-full {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: transparent; color: var(--ink); width: 100%;
    border: 1px solid var(--line);
    padding: 12px; border-radius: 2px;
    font-size: 12px; font-weight: 500; letter-spacing: 0.06em;
    text-transform: uppercase; font-family: var(--mono);
  }

  .divider {
    display: flex; align-items: center; margin: 28px 0 16px;
  }
  .divider-text {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.16em;
    color: var(--ink-muted); font-family: var(--mono);
  }
  .divider.expandable { cursor: pointer; user-select: none; gap: 8px; }
  .divider.expandable svg { color: var(--ink-muted); }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .empty {
    padding: 32px 16px; text-align: center;
    color: var(--ink-muted); font-size: 14px; font-style: italic;
  }

  .capture-card {
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 4px; padding: 14px 16px;
    position: relative;
  }
  .capture-card.noise { background: transparent; border-style: dashed; opacity: 0.75; }
  .capture-card.noise .capture-text { color: var(--ink-soft); }
  .capture-text { font-size: 15px; line-height: 1.5; margin-bottom: 10px; }
  .capture-meta { display: flex; justify-content: space-between; align-items: center; }
  .capture-time { font-size: 11px; color: var(--ink-muted); font-family: var(--mono); }
  .capture-meta-left { display: flex; align-items: center; gap: 10px; }
  .noise-badge {
    font-size: 9px; padding: 2px 6px; background: transparent;
    border: 1px solid var(--noise); color: var(--noise);
    border-radius: 2px; text-transform: uppercase;
    letter-spacing: 0.1em; font-family: var(--mono);
  }
  .capture-actions { display: flex; gap: 4px; }
  .icon-btn {
    color: var(--ink-soft); padding: 6px; display: flex;
    align-items: center; justify-content: center; border-radius: 2px;
  }

  /* Sheet (bottom modal) */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(26,22,18,0.55);
    z-index: 100; display: flex; align-items: flex-end;
    animation: fadeIn 0.2s ease;
  }
  .modal {
    background: var(--bg); width: 100%; max-height: 92vh;
    overflow-y: auto; border-radius: 12px 12px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    animation: slideUp 0.3s cubic-bezier(.2,.8,.2,1);
  }
  .modal-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
  }
  .modal-eyebrow {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em;
    color: var(--accent); font-weight: 600; font-family: var(--mono);
  }
  .modal-problem {
    font-size: 17px; font-style: italic; line-height: 1.4;
    margin-bottom: 24px; padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  .label {
    display: block; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--ink-soft); margin-bottom: 8px;
    font-family: var(--mono); font-weight: 500;
  }
  .label .label-sub {
    display: block; font-family: var(--serif); font-style: italic;
    text-transform: none; letter-spacing: 0; font-size: 12px;
    color: var(--ink-muted); margin-top: 3px; font-weight: 400;
  }
  .field-textarea, .field-input {
    width: 100%; background: var(--bg-card);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 10px 12px; font-size: 14px; line-height: 1.5;
    margin-bottom: 18px;
  }
  .field-input { padding: 12px; }

  .scale-row { margin-top: 20px; }
  .scale-head { display: flex; justify-content: space-between; align-items: baseline; }
  .scale-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--ink-soft); font-weight: 500; font-family: var(--mono);
  }
  .scale-val { font-size: 22px; font-weight: 500; font-style: italic; }
  .scale-sub { font-size: 12px; color: var(--ink-muted); margin-top: 2px; margin-bottom: 10px; }
  .scale-btns { display: flex; gap: 8px; }
  .scale-pip {
    flex: 1; height: 32px; border: 1px solid var(--line);
    border-radius: 2px; transition: all 0.15s;
  }
  .scale-pip.active { background: var(--ink); border-color: var(--ink); }
  .scale-bounds {
    display: flex; justify-content: space-between; margin-top: 6px;
    font-size: 10px; color: var(--ink-muted); text-transform: uppercase;
    letter-spacing: 0.08em; font-family: var(--mono);
  }

  .check-row { display: flex; gap: 8px; margin-top: 20px; }
  .check-opt {
    flex: 1; display: flex; align-items: center; justify-content: center;
    gap: 6px; padding: 12px 8px; border: 1px solid var(--line);
    border-radius: 2px; font-size: 12px; transition: all 0.15s;
    font-family: var(--serif);
  }
  .check-opt.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .score-box {
    margin: 24px 0; padding: 16px 20px;
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 4px; display: flex;
    justify-content: space-between; align-items: center;
  }
  .score-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--ink-soft); font-family: var(--mono);
  }
  .score-val { font-size: 36px; font-weight: 500; font-style: italic; color: var(--accent); line-height: 1; }

  /* Queue */
  .queue-card {
    display: flex; gap: 14px; align-items: flex-start;
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 4px; padding: 16px;
  }
  .queue-rank { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 34px; }
  .rank-num { font-size: 11px; color: var(--ink-muted); font-family: var(--mono); }
  .score-badge {
    background: var(--ink); color: var(--bg);
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; font-style: italic;
  }
  .queue-body { flex: 1; min-width: 0; }
  .queue-problem { font-size: 15px; line-height: 1.45; margin-bottom: 6px; }
  .queue-why { font-size: 13px; color: var(--ink-soft); font-style: italic; line-height: 1.45; margin-bottom: 10px; }
  .queue-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag {
    font-size: 10px; padding: 3px 8px; background: var(--line-soft);
    color: var(--ink-soft); border-radius: 2px; text-transform: uppercase;
    letter-spacing: 0.06em; font-family: var(--mono);
  }
  .tag-structured {
    background: var(--signal); color: var(--bg);
    display: inline-flex; align-items: center; gap: 4px;
  }
  .tag-unstructured {
    background: transparent; border: 1px dashed var(--ink-muted);
    color: var(--ink-muted);
  }
  .queue-actions {
    display: flex; flex-direction: column; gap: 4px;
  }

  /* Structure sheet specific */
  .structure-field { margin-bottom: 18px; }
  .layers-help {
    background: var(--line-soft); padding: 12px 14px;
    border-radius: 4px; font-size: 12px; line-height: 1.5;
    color: var(--ink-soft); margin-bottom: 12px;
  }

  /* Deep Work */
  .dw-pick-card {
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 4px; padding: 16px; margin-bottom: 10px;
    text-align: left; width: 100%; display: block;
  }
  .dw-pick-card.active {
    border-color: var(--ink); background: var(--bg);
  }
  .dw-pick-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 12px; margin-bottom: 6px;
  }
  .dw-pick-problem { font-size: 14px; line-height: 1.45; flex: 1; }
  .dw-pick-score {
    background: var(--ink); color: var(--bg);
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; flex-shrink: 0;
  }
  .dw-stage {
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 4px; padding: 16px; margin-bottom: 12px;
  }
  .dw-stage-head {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px;
  }
  .dw-stage-num {
    font-size: 11px; color: var(--accent); font-weight: 600;
    font-family: var(--mono); letter-spacing: 0.04em;
  }
  .dw-stage-label { font-size: 15px; font-style: italic; font-weight: 500; }
  .dw-stage-sub {
    font-size: 12px; color: var(--ink-muted); margin-bottom: 12px;
    margin-left: 30px; line-height: 1.5;
  }
  .dw-stage-textarea {
    width: 100%; background: transparent;
    border: none; border-top: 1px solid var(--line);
    padding: 12px 0 0; font-size: 14px; line-height: 1.55;
  }
  .dw-warn {
    background: var(--line-soft); padding: 12px 14px;
    border-radius: 4px; font-size: 12px; line-height: 1.5;
    color: var(--ink-soft); margin-bottom: 16px;
  }
  .dw-timer-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 4px; padding: 12px 14px; margin-bottom: 12px;
  }
  .dw-timer-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--ink-muted); font-family: var(--mono); font-weight: 500;
  }
  .dw-timer-display {
    flex: 1; font-family: var(--mono); font-size: 18px;
    color: var(--ink); letter-spacing: 0.04em; text-align: right;
  }
  .dw-timer-btn {
    padding: 8px 14px; background: var(--ink); color: var(--bg);
    border-radius: 2px; font-size: 11px; font-family: var(--mono);
    text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500;
  }
  .dw-reframe {
    background: var(--bg); border: 1px solid var(--accent);
    border-radius: 4px; padding: 14px 16px; margin-bottom: 16px;
    animation: slideUp 0.3s ease;
  }
  .dw-reframe-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
  .dw-reframe-head strong {
    font-size: 14px; font-style: italic; font-weight: 500; color: var(--accent);
  }
  .dw-reframe-body { font-size: 13px; line-height: 1.6; color: var(--ink-soft); }
  .dw-reframe-body ul { margin: 8px 0 0; padding-left: 18px; }
  .dw-reframe-body li { margin-bottom: 6px; }
  .dw-reframe-body strong { color: var(--ink); font-weight: 600; }

  /* Today */
  .today-count {
    display: flex; align-items: baseline; justify-content: center;
    margin: 8px 0 24px; gap: 4px;
  }
  .today-count-num { font-size: 64px; font-weight: 500; font-style: italic; color: var(--accent); line-height: 1; }
  .today-count-slash { font-size: 32px; color: var(--ink-muted); font-weight: 300; }
  .today-count-total { font-size: 32px; color: var(--ink-muted); font-style: italic; }
  .today-list { display: flex; flex-direction: column; gap: 12px; }
  .today-item {
    display: flex; align-items: center; gap: 14px;
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 4px; padding: 16px;
  }
  .today-marker { font-size: 13px; color: var(--accent); font-style: italic; font-weight: 500; min-width: 22px; }
  .today-input { flex: 1; border: none; background: transparent; font-size: 15px; line-height: 1.5; }
  .today-input.done { text-decoration: line-through; color: var(--ink-muted); }
  .today-item.done { opacity: 0.55; }
  .today-check {
    width: 22px; height: 22px; border: 1.5px solid var(--ink-muted);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    color: var(--bg); flex-shrink: 0;
    transition: all 0.15s;
  }
  .today-check.checked { background: var(--signal); border-color: var(--signal); }
  .today-clear { color: var(--ink-muted); }
  .pull-btn {
    display: flex; align-items: center; gap: 12px; width: 100%;
    border: 1px solid var(--line); border-radius: 4px;
    padding: 12px 14px; text-align: left;
  }
  .pull-score {
    background: var(--ink); color: var(--bg);
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; flex-shrink: 0;
  }
  .pull-text { flex: 1; font-size: 14px; }

  /* Dump */
  .dump-area {
    width: 100%; background: var(--bg-card);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 16px; font-size: 15px; line-height: 1.6;
    min-height: 320px;
  }
  .dump-count {
    margin-top: 8px; font-size: 11px; color: var(--ink-muted);
    font-family: var(--mono); text-align: right; letter-spacing: 0.04em;
  }

  /* Shutdown */
  .sd-field { margin-bottom: 20px; }
  .sd-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
  .sd-num { font-size: 11px; color: var(--accent); font-weight: 600; font-family: var(--mono); margin-top: 3px; }
  .sd-label { font-size: 15px; font-style: italic; font-weight: 500; }
  .sd-sub { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
  .sd-textarea {
    width: 100%; background: var(--bg-card);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 12px 14px; font-size: 14px; line-height: 1.5;
  }
  .history-card {
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 4px; padding: 14px 16px;
  }
  .history-date {
    font-size: 11px; color: var(--ink-muted); margin-bottom: 10px;
    font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.08em;
  }
  .history-row { font-size: 13px; line-height: 1.5; margin-top: 6px; color: var(--ink-soft); }
  .history-label {
    display: inline-block; font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--accent); font-weight: 600;
    margin-right: 8px; font-family: var(--mono);
  }

  /* Rewards */
  .reward-card {
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 4px; padding: 16px; margin-bottom: 10px;
  }
  .reward-card.claimed { opacity: 0.7; background: transparent; border-style: dashed; }
  .reward-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 10px; margin-bottom: 6px;
  }
  .reward-name { font-size: 16px; font-weight: 500; line-height: 1.3; flex: 1; }
  .reward-claimed-badge {
    font-size: 9px; padding: 3px 7px; background: var(--signal); color: var(--bg);
    border-radius: 2px; text-transform: uppercase; letter-spacing: 0.08em;
    font-family: var(--mono);
  }
  .reward-desc { font-size: 13px; color: var(--ink-soft); margin-bottom: 8px; line-height: 1.45; }
  .reward-goal {
    font-size: 12px; color: var(--ink-soft); padding: 8px 10px;
    background: var(--line-soft); border-radius: 3px; margin-bottom: 10px;
    line-height: 1.45; font-style: italic;
  }
  .reward-goal-label { font-style: normal; color: var(--accent); font-weight: 600; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; margin-right: 4px; }
  .reward-progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .reward-progress-bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .reward-progress-fill { height: 100%; background: var(--accent); transition: width 0.3s; }
  .reward-progress-num {
    font-family: var(--mono); font-size: 11px; color: var(--ink-soft);
    white-space: nowrap;
  }
  .reward-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .reward-step-btn {
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 2px;
    font-family: var(--mono); font-size: 12px; color: var(--ink); min-width: 42px;
  }
  .reward-edit-btn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 2px;
    font-family: var(--mono); font-size: 11px; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .reward-claim-btn {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 4px;
    padding: 8px 14px; background: var(--accent); color: var(--bg);
    border-radius: 2px; font-family: var(--mono); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500;
  }
  .reward-claim-btn.disabled { background: transparent; color: var(--ink-muted); border: 1px dashed var(--line); }
  .reward-claimed-date {
    font-size: 11px; color: var(--ink-muted); font-family: var(--mono);
    text-transform: uppercase; letter-spacing: 0.06em; margin-top: 6px;
  }

  /* Cloud sync */
  .sync-status {
    display: flex; align-items: center; gap: 8px;
    padding: 12px; background: var(--bg-card);
    border: 1px solid var(--line); border-radius: 4px;
    font-size: 12px; color: var(--ink-soft); margin-bottom: 12px;
  }
  .sync-status.active { border-color: var(--signal); }
  .sync-status .sync-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--ink-muted);
  }
  .sync-status.active .sync-dot { background: var(--signal); }
  .sync-form { margin-top: 8px; }
  .sync-form .field-input { font-family: var(--mono); font-size: 12px; }

  /* Settings */
  .settings-section { margin-bottom: 28px; }
  .settings-section-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--ink-soft); font-family: var(--mono);
    margin-bottom: 12px; font-weight: 500;
  }
  .setting-btn {
    width: 100%; display: flex; align-items: center; gap: 14px;
    padding: 16px; background: var(--bg-card);
    border: 1px solid var(--line); border-radius: 4px;
    text-align: left; margin-bottom: 8px;
  }
  .setting-icon { color: var(--accent); flex-shrink: 0; }
  .setting-content { flex: 1; }
  .setting-title { font-size: 15px; margin-bottom: 2px; }
  .setting-desc { font-size: 12px; color: var(--ink-muted); line-height: 1.4; }
  .setting-danger { color: #b91c1c; }
  .setting-danger .setting-icon { color: #b91c1c; }
  .stats-row {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
    margin-bottom: 16px;
  }
  .stat-box {
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 4px; padding: 14px;
  }
  .stat-num { font-size: 28px; font-weight: 500; font-style: italic; color: var(--accent); line-height: 1; }
  .stat-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--ink-muted); font-family: var(--mono); margin-top: 6px;
  }

  /* Header menu */
  .header-menu {
    position: absolute; top: 100%; right: 14px;
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 4px; padding: 6px; min-width: 200px;
    box-shadow: 0 8px 24px rgba(26,22,18,0.12);
    z-index: 20;
  }
  .header-menu-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 10px 12px; text-align: left;
    font-size: 13px; color: var(--ink); border-radius: 3px;
    font-family: var(--serif);
  }
  .header-menu-item:hover, .header-menu-item:active { background: var(--line-soft); }
  .header-menu-icon { color: var(--accent); display: flex; }
  .menu-divider { height: 1px; background: var(--line); margin: 6px 0; }

  /* Domains */
  .domain-card {
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 4px; padding: 14px 16px; margin-bottom: 10px;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .domain-order { display: flex; flex-direction: column; gap: 2px; padding-top: 2px; }
  .domain-order-btn {
    color: var(--ink-muted); padding: 2px; display: flex;
    align-items: center; justify-content: center;
  }
  .domain-order-btn:disabled { opacity: 0.25; }
  .domain-body { flex: 1; min-width: 0; }
  .domain-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 10px; margin-bottom: 8px;
  }
  .domain-name {
    font-size: 16px; font-weight: 500; line-height: 1.3;
    flex: 1; word-break: break-word;
  }
  .domain-status-pill {
    font-size: 9px; padding: 3px 7px; border-radius: 2px;
    text-transform: uppercase; letter-spacing: 0.08em;
    font-family: var(--mono); white-space: nowrap;
  }
  .ds-manual { background: transparent; border: 1px solid var(--ink-muted); color: var(--ink-muted); }
  .ds-drafted { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
  .ds-inuse { background: var(--accent); color: var(--bg); }
  .ds-delegated { background: #b08858; color: var(--bg); }
  .ds-systemized { background: var(--signal); color: var(--bg); }

  .domain-meta {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px;
    font-size: 11px; color: var(--ink-muted); font-family: var(--mono);
  }
  .domain-meta-item {
    display: inline-flex; align-items: center; gap: 4px;
  }
  .domain-meta-dots { display: inline-flex; gap: 2px; }
  .domain-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--line);
  }
  .domain-dot.filled { background: var(--accent); }

  .domain-intervention {
    font-size: 13px; line-height: 1.45; color: var(--ink);
    background: var(--line-soft); padding: 8px 10px;
    border-radius: 3px; margin-bottom: 8px;
  }
  .domain-intervention .domain-int-label {
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--accent); font-family: var(--mono); font-weight: 600;
    margin-right: 6px;
  }
  .domain-intervention.empty {
    background: transparent; border: 1px dashed var(--line);
    color: var(--ink-muted); font-style: italic;
  }

  .domain-counts {
    display: flex; gap: 14px; font-size: 11px;
    color: var(--ink-muted); font-family: var(--mono);
    padding-top: 6px; border-top: 1px solid var(--line-soft);
  }
  .domain-counts strong { color: var(--ink-soft); font-weight: 500; }

  .domain-add-btn {
    width: 100%; display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 14px; background: transparent;
    border: 1px dashed var(--line); border-radius: 4px;
    color: var(--ink-soft); font-family: var(--mono);
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
    margin-bottom: 16px;
  }

  /* Domain edit sheet */
  .status-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    margin-bottom: 18px;
  }
  .status-opt {
    padding: 10px 8px; border: 1px solid var(--line);
    border-radius: 2px; font-size: 11px; font-family: var(--mono);
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-soft); text-align: center;
    transition: all 0.15s;
  }
  .status-opt.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .cadence-row {
    display: flex; gap: 6px; margin-bottom: 18px;
  }
  .cadence-opt {
    flex: 1; padding: 10px 6px; border: 1px solid var(--line);
    border-radius: 2px; font-size: 11px; font-family: var(--mono);
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-soft); text-align: center;
  }
  .cadence-opt.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* Domain tag on queue items */
  .tag-domain {
    background: var(--accent); color: var(--bg);
    display: inline-flex; align-items: center; gap: 4px;
  }

  /* Promote modal — domain select */
  .domain-select-grid {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px;
  }
  .domain-select-opt {
    padding: 8px 12px; border: 1px solid var(--line);
    border-radius: 2px; font-size: 12px; color: var(--ink-soft);
    font-family: var(--serif);
  }
  .domain-select-opt.active {
    background: var(--accent); color: var(--bg); border-color: var(--accent);
  }
  .domain-select-empty {
    padding: 12px 14px; background: var(--line-soft);
    border-radius: 4px; font-size: 12px; color: var(--ink-soft);
    line-height: 1.5; margin-bottom: 18px;
  }

  /* Confirm */
  .confirm-overlay {
    position: fixed; inset: 0; background: rgba(26,22,18,0.6);
    z-index: 150; display: flex; align-items: center; justify-content: center;
    padding: 20px; animation: fadeIn 0.15s ease;
  }
  .confirm-box {
    background: var(--bg); border-radius: 8px; max-width: 360px; width: 100%;
    padding: 24px 22px;
    animation: slideUp 0.2s cubic-bezier(.2,.8,.2,1);
  }
  .confirm-title { font-size: 18px; font-style: italic; font-weight: 500; margin-bottom: 8px; line-height: 1.3; }
  .confirm-message { font-size: 14px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 20px; }
  .confirm-actions { display: flex; gap: 8px; }
  .confirm-cancel {
    flex: 1; padding: 12px; border: 1px solid var(--line);
    border-radius: 2px; font-size: 12px; font-family: var(--mono);
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft);
  }
  .confirm-ok {
    flex: 1; padding: 12px; background: var(--ink); color: var(--bg);
    border-radius: 2px; font-size: 12px; font-family: var(--mono);
    text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500;
  }
  .confirm-ok.danger { background: #991b1b; }

  /* Toast */
  .toast {
    position: fixed; bottom: calc(110px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg);
    padding: 12px 20px; border-radius: 4px;
    font-size: 13px; font-family: var(--mono);
    letter-spacing: 0.04em; z-index: 200;
    animation: slideUp 0.25s ease;
  }

  /* Tabbar */
  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(246, 241, 232, 0.92);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-around;
    padding: 10px 4px calc(18px + env(safe-area-inset-bottom));
    z-index: 50;
  }
  .tab-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    gap: 4px; padding: 6px 2px; position: relative;
    color: var(--ink-muted);
  }
  .tab-btn.active { color: var(--ink); }
  .tab-btn svg { stroke-width: 1.5; }
  .tab-btn.active svg { stroke-width: 2.2; }
  .tab-label {
    font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase;
    font-family: var(--mono); font-weight: 400;
  }
  .tab-btn.active .tab-label { font-weight: 600; }
  .active-dot {
    position: absolute; bottom: -2px;
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--accent);
  }

  .install-banner {
    position: fixed; bottom: calc(110px + env(safe-area-inset-bottom));
    left: 16px; right: 16px;
    background: var(--ink); color: var(--bg);
    padding: 14px 16px; border-radius: 6px;
    display: flex; align-items: center; gap: 12px;
    z-index: 60; animation: slideUp 0.3s ease;
  }
  .install-banner-text { flex: 1; font-size: 13px; line-height: 1.4; }
  .install-banner-btn {
    color: var(--bg); font-family: var(--mono);
    font-size: 12px; padding: 8px 12px; border: 1px solid var(--bg);
    border-radius: 2px; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .install-banner-close { color: var(--bg); padding: 4px; }

  /* ===== STRATEGIC COMPASS ===== */
  .compass {
    background: transparent; border: 1px dashed var(--line);
    border-radius: 4px; padding: 12px 14px; margin-bottom: 20px;
  }
  .compass-label {
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.16em;
    color: var(--accent); font-family: var(--mono); font-weight: 600;
    margin-bottom: 6px;
  }
  .compass-text {
    font-size: 12px; line-height: 1.5; color: var(--ink-soft); font-style: italic;
  }
  .compass-nudge {
    font-size: 11px; color: var(--ink-muted); font-style: italic;
    margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line-soft);
    line-height: 1.45;
  }

  /* ===== INBOX ITEM ===== */
  .inbox-card {
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 4px; padding: 14px 16px;
  }
  .inbox-text { font-size: 15px; line-height: 1.5; margin-bottom: 12px; }
  .inbox-meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .inbox-time { font-size: 11px; color: var(--ink-muted); font-family: var(--mono); }
  .btn-process {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--ink); color: var(--bg);
    padding: 8px 14px; border-radius: 2px;
    font-size: 11px; font-weight: 500; letter-spacing: 0.06em;
    text-transform: uppercase; font-family: var(--mono);
  }

  /* ===== FILTER / ROUTE SHEET ===== */
  .filter-question {
    font-size: 18px; line-height: 1.4; font-style: italic;
    margin-bottom: 6px; color: var(--ink);
  }
  .filter-sub {
    font-size: 12px; color: var(--ink-muted); line-height: 1.5;
    margin-bottom: 20px;
  }
  .route-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin-bottom: 8px;
  }
  .route-btn {
    padding: 18px 12px; border: 1px solid var(--line);
    border-radius: 4px; background: var(--bg-card);
    text-align: left; transition: all 0.15s;
  }
  .route-btn.active { border-color: var(--ink); background: var(--ink); color: var(--bg); }
  .route-btn-label {
    font-size: 14px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; font-family: var(--mono); margin-bottom: 4px;
  }
  .route-btn-desc { font-size: 11px; line-height: 1.4; opacity: 0.75; }
  .route-btn.now .route-btn-label { color: var(--accent); }
  .route-btn.now.active .route-btn-label { color: var(--bg); }

  .time-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    margin-bottom: 18px;
  }
  .time-opt {
    padding: 12px 6px; border: 1px solid var(--line); border-radius: 2px;
    font-family: var(--mono); font-size: 11px; color: var(--ink-soft);
    text-align: center; letter-spacing: 0.02em;
  }
  .time-opt.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .principle-note {
    background: var(--line-soft); padding: 12px 14px; border-radius: 4px;
    font-size: 12px; line-height: 1.55; color: var(--ink-soft);
    margin-bottom: 18px;
  }
  .principle-note strong { color: var(--ink); font-style: italic; }

  /* ===== TIER TOGGLE (primary/supporting) ===== */
  .tier-row { display: flex; gap: 8px; margin-bottom: 18px; }
  .tier-opt {
    flex: 1; padding: 12px 8px; border: 1px solid var(--line);
    border-radius: 2px; font-family: var(--mono); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-soft); text-align: center;
  }
  .tier-opt.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tier-opt:disabled { opacity: 0.35; }

  /* ===== TODAY: PRIMARY / SUPPORTING / DONE ===== */
  .today-deadline {
    font-size: 11px; font-family: var(--mono); color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.1em; text-align: center;
    margin-bottom: 18px;
  }
  .today-section-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.16em;
    color: var(--ink-muted); font-family: var(--mono);
    margin: 24px 0 12px; display: flex; align-items: center; gap: 8px;
  }
  .today-section-label.primary { color: var(--accent); font-weight: 600; }
  .primary-slot {
    display: flex; align-items: flex-start; gap: 12px;
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 4px; padding: 16px; margin-bottom: 10px;
  }
  .primary-slot.filled { border-left: 3px solid var(--accent); }
  .primary-slot.done { opacity: 0.5; }
  .primary-numeral {
    font-size: 14px; color: var(--accent); font-style: italic;
    font-weight: 500; min-width: 24px; padding-top: 1px;
  }
  .primary-body { flex: 1; min-width: 0; }
  .primary-text { font-size: 15px; line-height: 1.45; }
  .primary-text.done { text-decoration: line-through; color: var(--ink-muted); }
  .primary-why {
    font-size: 12px; color: var(--ink-muted); font-style: italic;
    margin-top: 5px; line-height: 1.45;
  }
  .primary-empty {
    font-size: 14px; color: var(--ink-muted); font-style: italic;
  }
  .supporting-row {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px; background: transparent;
    border: 1px solid var(--line-soft); border-radius: 3px;
    margin-bottom: 6px;
  }
  .supporting-text { flex: 1; font-size: 13px; line-height: 1.4; }
  .supporting-text.done { text-decoration: line-through; color: var(--ink-muted); }
  .done-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; font-size: 13px; color: var(--ink-muted);
    text-decoration: line-through; line-height: 1.4;
  }
  .check-circle {
    width: 20px; height: 20px; border: 1.5px solid var(--ink-muted);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    color: var(--bg); flex-shrink: 0; transition: all 0.15s;
  }
  .check-circle.checked { background: var(--signal); border-color: var(--signal); }
  .check-circle.sm { width: 17px; height: 17px; }

  /* ===== DELEGATED / WAITING ===== */
  .waiting-card {
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 4px; padding: 15px 16px; margin-bottom: 10px;
  }
  .waiting-card.overdue { border-color: #c2410c; }
  .waiting-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 10px; margin-bottom: 8px;
  }
  .waiting-owner {
    font-size: 10px; padding: 3px 8px; background: var(--accent); color: var(--bg);
    border-radius: 2px; text-transform: uppercase; letter-spacing: 0.08em;
    font-family: var(--mono); white-space: nowrap;
  }
  .waiting-task { font-size: 15px; line-height: 1.45; flex: 1; }
  .waiting-detail { font-size: 12px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 6px; }
  .waiting-dates {
    display: flex; gap: 14px; flex-wrap: wrap;
    font-size: 11px; font-family: var(--mono); color: var(--ink-muted);
    padding-top: 8px; border-top: 1px solid var(--line-soft); margin-top: 8px;
  }
  .waiting-dates .overdue-flag { color: #c2410c; font-weight: 600; }
  .waiting-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .waiting-btn {
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 2px;
    font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-soft);
  }
  .waiting-btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .waiting-btn.systemize { border-color: var(--accent); color: var(--accent); }

  /* ===== SCHEDULED ===== */
  .scheduled-card {
    background: transparent; border: 1px dashed var(--line);
    border-radius: 4px; padding: 14px 16px; margin-bottom: 10px;
  }
  .scheduled-card.due { background: var(--bg-card); border-style: solid; border-color: var(--accent); }
  .scheduled-when {
    font-size: 11px; font-family: var(--mono); color: var(--ink-muted);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px;
  }
  .scheduled-card.due .scheduled-when { color: var(--accent); font-weight: 600; }

  /* ===== SIGNAL SCORING ===== */
  .signal-q { margin-bottom: 22px; }
  .signal-q-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 3px;
  }
  .signal-q-num {
    font-size: 10px; font-family: var(--mono); color: var(--accent);
    font-weight: 600; letter-spacing: 0.08em; margin-right: 8px;
  }
  .signal-q-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--ink-soft); font-weight: 500; font-family: var(--mono);
  }
  .signal-q-val { font-size: 20px; font-weight: 500; font-style: italic; }
  .signal-q-text {
    font-size: 13px; color: var(--ink); line-height: 1.45;
    margin-bottom: 4px; font-style: italic;
  }
  .signal-q-hint { font-size: 11px; color: var(--ink-muted); margin-bottom: 9px; }
  .signal-score-box {
    margin: 22px 0 18px; padding: 16px 20px;
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 4px; display: flex;
    justify-content: space-between; align-items: center;
  }
  .worth-it-row { display: flex; gap: 8px; margin-bottom: 18px; }
  .worth-it-opt {
    flex: 1; padding: 13px 8px; border: 1px solid var(--line);
    border-radius: 2px; font-family: var(--mono); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-soft); text-align: center;
  }
  .worth-it-opt.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* ===== TYPE CLASSIFICATION ===== */
  .type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
  .type-opt {
    padding: 14px 8px; border: 1px solid var(--line); border-radius: 3px;
    text-align: center; transition: all 0.15s;
  }
  .type-opt.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .type-opt-label {
    font-size: 11px; font-family: var(--mono); text-transform: uppercase;
    letter-spacing: 0.08em; font-weight: 600; margin-bottom: 3px;
  }
  .type-opt-desc { font-size: 10px; line-height: 1.35; opacity: 0.7; }

  /* ===== QUEUE (signals) ===== */
  .signal-card {
    display: flex; gap: 13px; align-items: flex-start;
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 4px; padding: 15px;
  }
  .signal-rank { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 32px; }
  .signal-score-badge {
    background: var(--ink); color: var(--bg);
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; font-style: italic;
  }
  .signal-score-badge.high { background: var(--accent); }
  .type-tag {
    font-size: 9px; padding: 2px 6px; border-radius: 2px;
    text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--mono);
  }
  .type-tag.problem { background: var(--accent); color: var(--bg); }
  .type-tag.task { background: var(--line-soft); color: var(--ink-soft); }
  .type-tag.thought { background: transparent; border: 1px solid var(--line); color: var(--ink-muted); }

  /* ===== STEPS / BREAKDOWN ===== */
  .step-row {
    display: flex; align-items: flex-start; gap: 9px;
    padding: 10px 0; border-bottom: 1px solid var(--line-soft);
  }
  .step-row:last-child { border-bottom: none; }
  .step-num {
    font-size: 10px; font-family: var(--mono); color: var(--ink-muted);
    padding-top: 4px; min-width: 18px;
  }
  .step-input {
    flex: 1; border: none; background: transparent;
    font-size: 14px; line-height: 1.45; padding: 2px 0;
  }
  .step-input.done { text-decoration: line-through; color: var(--ink-muted); }
  .sub-row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 0 7px 30px;
  }
  .sub-input {
    flex: 1; border: none; background: transparent;
    font-size: 13px; line-height: 1.4; color: var(--ink-soft);
  }
  .sub-input.done { text-decoration: line-through; color: var(--ink-muted); }
  .step-actions { display: flex; gap: 2px; }
  .step-progress {
    font-size: 11px; font-family: var(--mono); color: var(--ink-muted);
    margin-bottom: 10px;
  }

  /* ===== CLOSE / SHUTDOWN ===== */
  .close-auto-section {
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 4px; padding: 15px 16px; margin-bottom: 14px;
  }
  .close-auto-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--accent); font-family: var(--mono); font-weight: 600;
    margin-bottom: 10px;
  }
  .close-auto-item {
    font-size: 13px; line-height: 1.5; color: var(--ink-soft);
    padding: 5px 0;
  }
  .close-auto-empty { font-size: 13px; color: var(--ink-muted); font-style: italic; }
  .open-item {
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 4px; padding: 13px 15px; margin-bottom: 9px;
  }
  .open-item-text { font-size: 14px; line-height: 1.45; margin-bottom: 9px; }
  .open-item-input {
    width: 100%; background: transparent; border: none;
    border-top: 1px solid var(--line-soft); padding-top: 9px;
    font-size: 13px; line-height: 1.45;
  }
  .open-item-label {
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--accent); font-family: var(--mono); font-weight: 600;
    display: block; margin-bottom: 5px;
  }

  /* ===== MISC ===== */
  .count-pill {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 17px; height: 17px; padding: 0 5px;
    background: var(--accent); color: var(--bg);
    border-radius: 9px; font-size: 10px; font-family: var(--mono);
    font-weight: 600; margin-left: 6px;
  }
  .tab-badge {
    position: absolute; top: 2px; right: 50%;
    transform: translateX(14px);
    min-width: 15px; height: 15px; padding: 0 4px;
    background: var(--accent); color: var(--bg);
    border-radius: 8px; font-size: 9px; font-family: var(--mono);
    font-weight: 600; display: flex; align-items: center; justify-content: center;
  }
  .section-actions { display: flex; gap: 8px; margin-bottom: 16px; }
  .mini-btn {
    padding: 9px 13px; border: 1px solid var(--line); border-radius: 2px;
    font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-soft);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .mini-btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
</style>

<script>
// ============ STATE ============
const STORAGE_KEY = 'ledger_v1';

const MISSION = "Build a system-driven business where my attention is primarily on Sales, Marketing & Demand — not routine operations.";

const defaultState = {
  items: [],        // unified item model — see normalizeState for shape
  domains: [],
  deepWork: [],
  rewards: [],
  milestones: [],
  history: [],
  shutdown: { date: '', movedForward: '' },
  brainDump: '',
  people: [],       // delegate owners, remembered for quick pick
  cloudSync: { enabled: false, projectId: '', apiKey: '', userId: '', lastSync: 0 },
};

let state = loadState();
let currentTab = 'capture';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return JSON.parse(JSON.stringify(defaultState));
    return JSON.parse(raw);
  } catch { return JSON.parse(JSON.stringify(defaultState)); }
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { console.error('Save failed', e); }
  if (typeof scheduleCloudPush === 'function') scheduleCloudPush();
}

function todayKey() { return new Date().toISOString().slice(0, 10); }
function uid(p) { return (p || 'i') + '_' + Date.now() + '_' + Math.floor(Math.random() * 10000); }

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function nl2br(s) { return escapeHtml(s).replace(/\n/g, '<br>'); }
function formatDate(d) {
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}
function shortDate(d) {
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  return Math.floor(s / 86400) + 'd';
}

// ============ ITEM HELPERS ============
function byStatus(st) { return state.items.filter(i => i.status === st); }
function inboxItems() { return byStatus('inbox').sort((a,b) => b.ts - a.ts); }
function nowItems() { return byStatus('now').sort((a,b) => b.ts - a.ts); }
function todayItems() {
  return state.items.filter(i => i.status === 'today' && i.todayMeta && i.todayMeta.date === todayKey());
}
function todayPrimary() { return todayItems().filter(i => i.todayMeta.tier === 'primary'); }
function todaySupporting() { return todayItems().filter(i => i.todayMeta.tier !== 'primary'); }
function doneToday() {
  const tk = todayKey();
  return state.items.filter(i => i.status === 'done' && i.doneAt && new Date(i.doneAt).toISOString().slice(0,10) === tk);
}
function delegatedItems() {
  return byStatus('delegated').sort((a,b) => {
    const ad = a.delegateMeta && a.delegateMeta.checkBackAt ? a.delegateMeta.checkBackAt : '9999';
    const bd = b.delegateMeta && b.delegateMeta.checkBackAt ? b.delegateMeta.checkBackAt : '9999';
    return ad.localeCompare(bd);
  });
}
function scheduledItems() {
  return byStatus('scheduled').sort((a,b) => {
    const ar = (a.scheduleMeta && a.scheduleMeta.returnAt) || '9999';
    const br = (b.scheduleMeta && b.scheduleMeta.returnAt) || '9999';
    return ar.localeCompare(br);
  });
}
function signalItems() {
  return state.items.filter(i => i.classification === 'signal' && i.status !== 'done' && i.status !== 'archived')
    .sort((a,b) => (b.signal ? b.signal.score : 0) - (a.signal ? a.signal.score : 0));
}
function dueScheduled() {
  const tk = todayKey();
  return scheduledItems().filter(i => i.scheduleMeta && i.scheduleMeta.returnAt && i.scheduleMeta.returnAt <= tk);
}
function overdueCheckBacks() {
  const tk = todayKey();
  return delegatedItems().filter(i => i.delegateMeta && i.delegateMeta.checkBackAt && i.delegateMeta.checkBackAt <= tk);
}
function itemLabel(it) {
  if (it.delegateMeta && it.delegateMeta.task) return it.delegateMeta.task;
  return it.text;
}
function stepProgress(it) {
  if (!it.steps || !it.steps.length) return null;
  let total = 0, done = 0;
  it.steps.forEach(s => {
    total++; if (s.done) done++;
    (s.subs || []).forEach(sb => { total++; if (sb.done) done++; });
  });
  return { done, total };
}
function markDone(id) {
  const it = state.items.find(x => x.id === id);
  if (!it) return;
  it.status = 'done';
  it.doneAt = Date.now();
  saveState();
}
function unDone(id, back) {
  const it = state.items.find(x => x.id === id);
  if (!it) return;
  it.status = back || 'today';
  it.doneAt = null;
  saveState();
}
function domainById(id) { return state.domains.find(d => d.id === id); }

// ============ ICONS ============
const icons = {
  inbox: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>',

  settings: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',

};

// ============ RENDER ============
function render() {
  const dt = document.getElementById('dateText');
  if (dt) dt.textContent = formatDate(new Date());
  renderTabbar();
  renderMain();
}

function renderTabbar() {
  const inboxN = inboxItems().length;
  const waitingN = overdueCheckBacks().length + dueScheduled().length;
  const tabs = [
    { id: 'capture', label: 'Capture', icon: icons.inbox, badge: inboxN },
    { id: 'today', label: 'Today', icon: icons.sun },
    { id: 'queue', label: 'Signals', icon: icons.list },
    { id: 'deep', label: 'Deep', icon: icons.brain },
    { id: 'waiting', label: 'Waiting', icon: icons.users, badge: waitingN },
    { id: 'close', label: 'Close', icon: icons.moon },
  ];
  document.getElementById('tabbar').innerHTML = tabs.map(t => `
    <button class="tab-btn ${currentTab === t.id ? 'active' : ''}" data-tab="${t.id}">
      ${t.icon}
      <span class="tab-label">${t.label}</span>
      ${t.badge ? `<span class="tab-badge">${t.badge}</span>` : ''}
      ${currentTab === t.id ? '<div class="active-dot"></div>' : ''}
    </button>
  `).join('');
  document.querySelectorAll('[data-tab]').forEach(b => {
    b.addEventListener('click', () => { currentTab = b.dataset.tab; render(); });
  });
}

function renderMain() {
  const m = document.getElementById('main');
  try {
    if (currentTab === 'capture') renderCapture(m);
    else if (currentTab === 'today') renderToday(m);
    else if (currentTab === 'queue') renderQueue(m);
    else if (currentTab === 'deep') renderDeep(m);
    else if (currentTab === 'waiting') renderWaiting(m);
    else if (currentTab === 'close') renderClose(m);
    else if (currentTab === 'scheduled') renderScheduled(m);
    else if (currentTab === 'domains') renderDomains(m);
    else if (currentTab === 'dump') renderDump(m);
    else if (currentTab === 'history') renderHistory(m);
    else if (currentTab === 'rewards') renderRewards(m);
    else if (currentTab === 'settings') renderSettings(m);
  } catch (e) {
    console.error('Tab render failed:', currentTab, e);
    m.innerHTML = `<div style="padding:20px;">
      <div class="eyebrow">Tab error</div>
      <h1>This tab failed.</h1>
      <p class="sub">Other tabs may still work.</p>
      <p style="font-size:11px;background:var(--line-soft);padding:10px;border-radius:3px;font-family:var(--mono);word-break:break-word;margin:14px 0;">${escapeHtml(e.message || String(e))}</p>
      <a href="./rescue.html" class="btn-primary-full" style="text-decoration:none;">Open Rescue</a>
    </div>`;
  }
}

// ============ 1. CAPTURE (frictionless) ============
function renderCapture(root) {
  const inbox = inboxItems();
  root.innerHTML = `
    <div class="section-head">
      <div class="eyebrow">Capture</div>
      <h1>What's on your mind?</h1>
      <p class="sub">Write it. Save it. Decide later. Capture should take seconds — no categories, no priorities, no thinking.</p>
    </div>
    <div class="capture-box">
      <textarea class="capture-textarea" id="captureText" placeholder="Anything. A thought, a task, a worry, an idea…" rows="3"></textarea>
      <button class="btn-primary-full" id="captureBtn" disabled>${icons.plus}<span>Capture</span></button>
    </div>

    <div class="divider"><span class="divider-text">${inbox.length === 0 ? 'Inbox empty' : inbox.length + ' waiting to process'}</span></div>
    <div class="list">
      ${inbox.length === 0
        ? '<div class="empty">Nothing to process. Capture something above.</div>'
        : inbox.map(it => `
          <div class="inbox-card">
            <div class="inbox-text">${nl2br(it.text)}</div>
            <div class="inbox-meta">
              <span class="inbox-time">${timeAgo(it.ts)}</span>
              <div style="display:flex;gap:6px;align-items:center;">
                <button class="icon-btn" data-del-inbox="${it.id}">${icons.x}</button>
                <button class="btn-process" data-process="${it.id}">Process ${icons.arrowRight}</button>
              </div>
            </div>
          </div>
        `).join('')}
    </div>
  `;

  const ta = document.getElementById('captureText');
  const btn = document.getElementById('captureBtn');
  ta.addEventListener('input', () => { btn.disabled = !ta.value.trim(); });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); doCapture(ta); }
  });
  btn.addEventListener('click', () => doCapture(ta));

  document.querySelectorAll('[data-process]').forEach(b => {
    b.addEventListener('click', () => openProcess(b.dataset.process));
  });
  document.querySelectorAll('[data-del-inbox]').forEach(b => {
    b.addEventListener('click', () => {
      const it = state.items.find(x => x.id === b.dataset.delInbox);
      if (!it) return;
      confirmDialog({
        title: 'Discard this?',
        message: `"${it.text.slice(0, 80)}${it.text.length > 80 ? '…' : ''}"`,
        okText: 'Discard',
        onConfirm: () => {
          state.items = state.items.filter(x => x.id !== it.id);
          saveState(); render();
        },
      });
    });
  });
}

function doCapture(ta) {
  const text = ta.value.trim();
  if (!text) return;
  state.items.unshift({
    id: uid('i'), text, ts: Date.now(), status: 'inbox',
    needsMe: null, nowMeta: null, todayMeta: null, delegateMeta: null,
    scheduleMeta: null, classification: null, signal: null, itemType: null,
    steps: [], domainId: null, doneAt: null, nextAction: '',
  });
  saveState();
  ta.value = '';
  render();
}

// ============ 2-8. PROCESS FLOW (filter → route → detail) ============
let proc = null;   // { itemId, stage, ...draft }

const TIME_OPTS = ['<5 min', '5–15 min', '15–30 min', '30–60 min', '60+ min'];
const SIGNAL_QS = [
  { key: 'impact', num: '01', label: 'Impact',
    q: 'If this continues, how materially does it hurt the business?',
    lo: 'Negligible', hi: 'Major consequence' },
  { key: 'frequency', num: '02', label: 'Frequency',
    q: 'How often is this actually happening?',
    lo: 'Isolated', hi: 'Constantly recurring' },
  { key: 'evidence', num: '03', label: 'Evidence',
    q: 'How much evidence do I have that this is real rather than an assumption?',
    lo: 'Speculation', hi: 'Repeatedly observed' },
  { key: 'strategic', num: '04', label: 'Strategic Relevance',
    q: 'How directly does solving this support Sales → Marketing → Demand → predictable production?',
    lo: 'Unrelated', hi: 'Directly relevant' },
  { key: 'leverage', num: '05', label: 'System Leverage',
    q: 'If I solve this properly, how much recurring work or dependency disappears?',
    lo: 'One-time fix', hi: 'Removes dependency' },
];

function openProcess(itemId) {
  const it = state.items.find(x => x.id === itemId);
  if (!it) return;
  proc = {
    itemId, stage: 'filter',
    route: null,
    timeEst: null, oppCost: '', consequence: '',
    tier: 'primary', whyToday: '', whatIfNot: '',
    owner: '', task: it.text, dueBy: '', checkBackAt: '',
    returnAt: '', classification: null,
    signal: { impact: 3, frequency: 3, evidence: 3, strategic: 3, leverage: 3 },
    worthIt: null, itemType: null,
  };
  renderProcess();
}

function signalScore() {
  const s = proc.signal;
  return s.impact + s.frequency + s.evidence + s.strategic + s.leverage;
}

function renderProcess() {
  const it = state.items.find(x => x.id === proc.itemId);
  if (!it) { closeModal(); return; }
  let body = '';
  const stage = proc.stage;

  if (stage === 'filter') {
    body = `
      <div class="filter-question">Does this require MY attention — or does the business merely require it to be done?</div>
      <div class="filter-sub">This is the deal-breaker. Most things don't actually need you.</div>
      <div class="route-grid" style="grid-template-columns:1fr;">
        <button class="route-btn" data-filter="yes">

        <button class="route-btn" data-filter="no">

          <div class="route-btn-desc">Someone else could execute this. I'm not uniquely required.</div>
        </button>
        <button class="route-btn" data-filter="neither">
          <div class="route-btn-label">Neither</div>
          <div class="route-btn-desc">Doesn't deserve attention at all. Drop it.</div>
        </button>
      </div>
    `;
  }

  else if (stage === 'route') {
    const hint = proc.needsMe === false
      ? 'You said this doesn\'t need you — Delegate is usually the right call.'
      : '';
    body = `
      <div class="filter-question">Where does this go?</div>
      ${hint ? `<div class="filter-sub">${hint}</div>` : '<div class="filter-sub">Pick the route. You can change it later.</div>'}
      <div class="route-grid">
        <button class="route-btn now" data-route="now">
          <div class="route-btn-label">Now</div>
          <div class="route-btn-desc">Interrupt current work and do it.</div>
        </button>
        <button class="route-btn" data-route="today">
          <div class="route-btn-label">Today</div>
          <div class="route-btn-desc">Must be done before 6 PM.</div>
        </button>
        <button class="route-btn" data-route="delegate">
          <div class="route-btn-label">Delegate</div>
          <div class="route-btn-desc">Someone else owns execution.</div>
        </button>
        <button class="route-btn" data-route="schedule">
          <div class="route-btn-label">Schedule</div>
          <div class="route-btn-desc">Comes back later. Not now.</div>
        </button>
      </div>
    `;
  }

  else if (stage === 'now') {
    body = `
      <div class="principle-note">
        <strong>Do it NOW only when the consequence of delay outweighs the cost of interrupting your current work.</strong>
        Short does not automatically mean now.
      </div>
      <label class="label">How much time will this consume?</label>
      <div class="time-grid" id="timeGrid">
        ${TIME_OPTS.map(t => `<button class="time-opt ${proc.timeEst === t ? 'active' : ''}" data-time="${t}">${t}</button>`).join('')}
      </div>
      <label class="label">What is the opportunity cost of my time on this right now?<span class="label-sub">What are you giving up to do it?</span></label>
      <textarea class="field-textarea" id="p-oppcost" rows="2" placeholder="What gets displaced…">${escapeHtml(proc.oppCost)}</textarea>
      <label class="label">What happens if I don't deal with this right now?<span class="label-sub">A 2-minute task can still have a large consequence if delayed.</span></label>
      <textarea class="field-textarea" id="p-consequence" rows="2" placeholder="Consequence of delay…">${escapeHtml(proc.consequence)}</textarea>
      <button class="btn-primary-full" id="p-confirm">${icons.check}<span>Move to Now</span></button>
    `;
  }

  else if (stage === 'today') {
    const primaryCount = todayPrimary().length;
    const primaryFull = primaryCount >= 3;
    if (primaryFull && proc.tier === 'primary') proc.tier = 'supporting';
    body = `
      <div class="principle-note">
        <strong>Three. Not fifteen.</strong>
        Today has a hard deadline of 6:00 PM. Primary slots used: ${primaryCount}/3.
      </div>
      <label class="label">Which tier?</label>
      <div class="tier-row">
        <button class="tier-opt ${proc.tier === 'primary' ? 'active' : ''}" data-tier="primary" ${primaryFull ? 'disabled' : ''}>
          Primary${primaryFull ? ' (full)' : ''}
        </button>
        <button class="tier-opt ${proc.tier === 'supporting' ? 'active' : ''}" data-tier="supporting">Supporting</button>
      </div>
      <label class="label">Why does this genuinely need to be completed today?<span class="label-sub">If you can't answer, it probably belongs in Schedule.</span></label>
      <textarea class="field-textarea" id="p-whytoday" rows="2" placeholder="Real reason…">${escapeHtml(proc.whyToday)}</textarea>
      <label class="label">What happens if it isn't? <span style="opacity:0.6;">(optional)</span></label>
      <textarea class="field-textarea" id="p-whatifnot" rows="2" placeholder="Optional">${escapeHtml(proc.whatIfNot)}</textarea>
      <button class="btn-primary-full" id="p-confirm">${icons.check}<span>Add to Today</span></button>
    `;
  }

  else if (stage === 'delegate') {
    const people = state.people || [];
    body = `
      <div class="principle-note">
        <strong>Delegation transfers execution, not accountability.</strong>
        You'll still see this in Waiting until it's done.
      </div>
      <label class="label">Who owns this?</label>
      ${people.length ? `<div class="domain-select-grid">
        ${people.map(p => `<button class="domain-select-opt ${proc.owner === p ? 'active' : ''}" data-person="${escapeHtml(p)}">${escapeHtml(p)}</button>`).join('')}
      </div>` : ''}
      <input class="field-input" id="p-owner" value="${escapeHtml(proc.owner)}" placeholder="Name" />
      <label class="label">What exactly needs to be done?<span class="label-sub">Written as they'd receive it.</span></label>
      <textarea class="field-textarea" id="p-task" rows="3">${escapeHtml(proc.task)}</textarea>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div>
          <label class="label">Complete by</label>
          <input type="date" class="field-input" id="p-dueby" value="${proc.dueBy}" />
        </div>
        <div>
          <label class="label">Check back on</label>
          <input type="date" class="field-input" id="p-checkback" value="${proc.checkBackAt}" />
        </div>
      </div>
      <button class="btn-primary-full" id="p-confirm">${icons.check}<span>Delegate</span></button>
    `;
  }

  else if (stage === 'schedule') {
    body = `
      <label class="label">When should this come back to my attention?</label>
      <input type="date" class="field-input" id="p-returnat" value="${proc.returnAt}" />
      <div class="section-actions" style="flex-wrap:wrap;">
        <button class="mini-btn" data-quick="3">+3 days</button>
        <button class="mini-btn" data-quick="7">+1 week</button>
        <button class="mini-btn" data-quick="30">+1 month</button>
        <button class="mini-btn" data-quick="90">+3 months</button>
      </div>
      <button class="btn-primary-full" id="p-confirm">Next: Signal or Noise ${icons.arrowRight}</button>
    `;
  }

  else if (stage === 'classify') {
    body = `
      <div class="filter-question">Signal or noise?</div>
      <div class="filter-sub">Not "important vs unimportant" — this is about evidence and consequence.</div>
      <div class="route-grid" style="grid-template-columns:1fr;">
        <button class="route-btn" data-class="noise">
          <div class="route-btn-label">Noise</div>
          <div class="route-btn-desc">A thought, possibility, isolated observation, or hypothetical concern. Not enough evidence or consequence yet to justify work.</div>
        </button>
        <button class="route-btn" data-class="signal">
          <div class="route-btn-label">Signal</div>
          <div class="route-btn-desc">Enough evidence, impact, recurrence, or system-level consequence to deserve investigation.</div>
        </button>
      </div>
    `;
  }

  else if (stage === 'score') {
    body = `
      ${SIGNAL_QS.map(sq => `
        <div class="signal-q">
          <div class="signal-q-head">
            <span><span class="signal-q-num">${sq.num}</span><span class="signal-q-label">${sq.label}</span></span>
            <span class="signal-q-val" id="sv-${sq.key}">${proc.signal[sq.key]}</span>
          </div>
          <div class="signal-q-text">${sq.q}</div>
          <div class="scale-btns" data-sigscale="${sq.key}">
            ${[1,2,3,4,5].map(n => `<button class="scale-pip ${n <= proc.signal[sq.key] ? 'active' : ''}" data-sigval="${sq.key}:${n}"></button>`).join('')}
          </div>
          <div class="scale-bounds"><span>${sq.lo}</span><span>${sq.hi}</span></div>
        </div>
      `).join('')}
      <div class="signal-score-box">
        <div class="score-label">Signal Score</div>
        <div class="score-val" id="sigScoreVal">${signalScore()}</div>
      </div>
      <div class="principle-note">
        Score is information, not a verdict. A one-time issue can still be top priority if its impact is enormous.
      </div>
      <label class="label">Given everything else competing for attention, does this deserve to be worked on before the others?</label>
      <div class="worth-it-row">
        <button class="worth-it-opt ${proc.worthIt === 'yes' ? 'active' : ''}" data-worth="yes">Yes, ahead</button>
        <button class="worth-it-opt ${proc.worthIt === 'later' ? 'active' : ''}" data-worth="later">Not yet</button>
      </div>
      <button class="btn-primary-full" id="p-confirm" ${proc.worthIt ? '' : 'disabled'}>Next: What is it? ${icons.arrowRight}</button>
    `;
  }

  else if (stage === 'type') {
    body = `
      <div class="filter-question">What is this, actually?</div>
      <div class="filter-sub">Only genuine problems belong in Deep. Don't turn every task into a problem-solving exercise.</div>
      <div class="type-grid">
        <button class="type-opt ${proc.itemType === 'thought' ? 'active' : ''}" data-type="thought">
          <div class="type-opt-label">Thought</div>
          <div class="type-opt-desc">Noticed or considered</div>
        </button>
        <button class="type-opt ${proc.itemType === 'task' ? 'active' : ''}" data-type="task">
          <div class="type-opt-label">Task</div>
          <div class="type-opt-desc">Needs execution</div>
        </button>
        <button class="type-opt ${proc.itemType === 'problem' ? 'active' : ''}" data-type="problem">
          <div class="type-opt-label">Problem</div>
          <div class="type-opt-desc">Recurring or harmful</div>
        </button>
      </div>
      ${state.domains.length ? `
        <label class="label">Domain <span style="opacity:0.6;">(optional)</span></label>
        <div class="domain-select-grid">
          <button class="domain-select-opt ${!proc.domainId ? 'active' : ''}" data-dsel="">None</button>
          ${state.domains.map(d => `<button class="domain-select-opt ${proc.domainId === d.id ? 'active' : ''}" data-dsel="${d.id}">${escapeHtml(d.name)}</button>`).join('')}
        </div>
      ` : ''}
      <button class="btn-primary-full" id="p-confirm" ${proc.itemType ? '' : 'disabled'}>${icons.check}<span>Save</span></button>

  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" id="modalOverlay">

        </div>
        <div class="modal-problem">"${escapeHtml(it.text)}"</div>
        ${body}
        ${stage !== 'filter' ? `<button class="btn-secondary-full" id="p-back" style="margin-top:10px;">Back</button>` : ''}
      </div>
    </div>

  bindProcess(it);
}

function bindProcess(it) {
  document.getElementById('modalOverlay').addEventListener('click', closeModal);
  document.getElementById('modalBody').addEventListener('click', e => e.stopPropagation());
  document.getElementById('closeModal').addEventListener('click', closeModal);

  const back = document.getElementById('p-back');
  if (back) back.addEventListener('click', () => {
    const s = proc.stage;
    if (['now','today','delegate','schedule'].includes(s)) proc.stage = 'route';
    else if (s === 'route') proc.stage = 'filter';
    else if (s === 'classify') proc.stage = 'schedule';
    else if (s === 'score') proc.stage = 'classify';
    else if (s === 'type') proc.stage = proc.classification === 'signal' ? 'score' : 'classify';
    renderProcess();
  });

  // FILTER
  document.querySelectorAll('[data-filter]').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.filter;
    if (v === 'neither') {
      state.items = state.items.filter(x => x.id !== it.id);
      saveState(); closeModal(); showToast('Dropped'); render();
      return;
    }
    proc.needsMe = v === 'yes';
    proc.stage = 'route';
    renderProcess();
  }));

  // ROUTE
  document.querySelectorAll('[data-route]').forEach(b => b.addEventListener('click', () => {
    proc.route = b.dataset.route;
    proc.stage = b.dataset.route;
    renderProcess();
  }));

  // NOW
  document.querySelectorAll('[data-time]').forEach(b => b.addEventListener('click', () => {
    proc.timeEst = b.dataset.time;
    document.querySelectorAll('[data-time]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
  }));

  // TODAY tier
  document.querySelectorAll('[data-tier]').forEach(b => b.addEventListener('click', () => {
    if (b.disabled) return;
    proc.tier = b.dataset.tier;
    document.querySelectorAll('[data-tier]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
  }));

  // DELEGATE quick-person
  document.querySelectorAll('[data-person]').forEach(b => b.addEventListener('click', () => {
    proc.owner = b.dataset.person;
    const inp = document.getElementById('p-owner');
    if (inp) inp.value = proc.owner;
    document.querySelectorAll('[data-person]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
  }));

  // SCHEDULE quick dates
  document.querySelectorAll('[data-quick]').forEach(b => b.addEventListener('click', () => {
    const days = Number(b.dataset.quick);
    const d = new Date(); d.setDate(d.getDate() + days);
    proc.returnAt = d.toISOString().slice(0, 10);
    const inp = document.getElementById('p-returnat');
    if (inp) inp.value = proc.returnAt;
    document.querySelectorAll('[data-quick]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
  }));

  // CLASSIFY
  document.querySelectorAll('[data-class]').forEach(b => b.addEventListener('click', () => {
    proc.classification = b.dataset.class;
    proc.stage = proc.classification === 'signal' ? 'score' : 'type';
    renderProcess();
  }));

  // SIGNAL SCORING
  document.querySelectorAll('[data-sigval]').forEach(b => b.addEventListener('click', () => {
    const [k, v] = b.dataset.sigval.split(':');
    proc.signal[k] = Number(v);
    const wrap = document.querySelector(`[data-sigscale="${k}"]`);
    if (wrap) wrap.querySelectorAll('.scale-pip').forEach((p, i) => {
      p.classList.toggle('active', (i + 1) <= proc.signal[k]);
    });
    const valEl = document.getElementById('sv-' + k);
    if (valEl) valEl.textContent = proc.signal[k];
    const scoreEl = document.getElementById('sigScoreVal');
    if (scoreEl) scoreEl.textContent = signalScore();
  }));
  document.querySelectorAll('[data-worth]').forEach(b => b.addEventListener('click', () => {
    proc.worthIt = b.dataset.worth;
    document.querySelectorAll('[data-worth]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    const c = document.getElementById('p-confirm');
    if (c) c.disabled = false;
  }));

  // TYPE
  document.querySelectorAll('[data-type]').forEach(b => b.addEventListener('click', () => {
    proc.itemType = b.dataset.type;
    document.querySelectorAll('[data-type]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    const c = document.getElementById('p-confirm');
    if (c) c.disabled = false;
  }));
  document.querySelectorAll('[data-dsel]').forEach(b => b.addEventListener('click', () => {
    proc.domainId = b.dataset.dsel || null;
    document.querySelectorAll('[data-dsel]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
  }));

  // CONFIRM
  const conf = document.getElementById('p-confirm');
  if (conf) conf.addEventListener('click', () => commitProcess(it));
}

function commitProcess(it) {
  const s = proc.stage;

  if (s === 'now') {
    proc.oppCost = (document.getElementById('p-oppcost') || {}).value || '';
    proc.consequence = (document.getElementById('p-consequence') || {}).value || '';
    it.status = 'now';
    it.needsMe = proc.needsMe;
    it.nowMeta = { timeEst: proc.timeEst, oppCost: proc.oppCost.trim(), consequence: proc.consequence.trim() };
    saveState(); closeModal(); showToast('Moved to Now'); currentTab = 'today'; render();
    return;
  }

  if (s === 'today') {
    proc.whyToday = (document.getElementById('p-whytoday') || {}).value || '';
    proc.whatIfNot = (document.getElementById('p-whatifnot') || {}).value || '';
    it.status = 'today';
    it.needsMe = proc.needsMe;
    it.todayMeta = {
      tier: proc.tier, date: todayKey(),
      whyToday: proc.whyToday.trim(), whatIfNot: proc.whatIfNot.trim(),
    };
    saveState(); closeModal(); showToast('Added to Today'); currentTab = 'today'; render();
    return;
  }

  if (s === 'delegate') {
    const owner = ((document.getElementById('p-owner') || {}).value || '').trim();
    const task = ((document.getElementById('p-task') || {}).value || '').trim();
    if (!owner) { showToast('Who owns this?'); return; }
    it.status = 'delegated';
    it.needsMe = proc.needsMe;
    it.delegateMeta = {
      owner, task: task || it.text,
      dueBy: (document.getElementById('p-dueby') || {}).value || '',
      checkBackAt: (document.getElementById('p-checkback') || {}).value || '',
      delegatedAt: Date.now(),
    };
    state.people = state.people || [];
    if (!state.people.includes(owner)) state.people.push(owner);
    saveState(); closeModal(); showToast('Delegated to ' + owner); currentTab = 'waiting'; render();
    return;
  }

  if (s === 'schedule') {
    const ra = (document.getElementById('p-returnat') || {}).value || proc.returnAt;
    if (!ra) { showToast('Pick a return date'); return; }
    proc.returnAt = ra;
    proc.stage = 'classify';
    renderProcess();
    return;
  }

  if (s === 'score') {
    if (!proc.worthIt) { showToast('Answer the priority question'); return; }
    proc.stage = 'type';
    renderProcess();
    return;
  }

  if (s === 'type') {
    if (!proc.itemType) { showToast('Pick a type'); return; }
    it.status = 'scheduled';
    it.needsMe = proc.needsMe;
    it.scheduleMeta = { returnAt: proc.returnAt };
    it.classification = proc.classification;
    it.itemType = proc.itemType;
    it.domainId = proc.domainId || null;
    if (proc.classification === 'signal') {
      it.signal = { ...proc.signal, score: signalScore(), worthIt: proc.worthIt };
    }
    saveState(); closeModal();
    showToast(proc.classification === 'signal' ? 'Filed as signal' : 'Parked as noise');
    render();
    return;
  }
}
